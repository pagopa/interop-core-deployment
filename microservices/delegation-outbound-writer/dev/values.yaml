name: "interop-be-delegation-outbound-writer"
techStack: "nodejs"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-delegation-outbound-writer-{{.Values.namespace}}-es1"

service:
  create: false

configmap:
  KAFKA_CLIENT_ID: "{{.Values.namespace}}-pagopa-interop-delegation-outbound-writer"
  KAFKA_GROUP_ID: "{{.Values.namespace}}-delegation-outbound-writer"

deployment:
  env:
    TOPIC_STARTING_OFFSET: "earliest"
    DELEGATION_TOPIC: "{{.Values.commons.kafka.delegationTopic}}"
    PRODUCER_KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
    KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
  envFromConfigmaps:
    DELEGATION_OUTBOUND_TOPIC: "common-kafka.DELEGATION_OUTBOUND_TOPIC"
    PRODUCER_KAFKA_CLIENT_ID: "{{.Values.name}}.KAFKA_CLIENT_ID"
