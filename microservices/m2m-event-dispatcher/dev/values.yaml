name: interop-be-m2m-event-dispatcher
techStack: nodejs

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-m2m-event-dispatcher-{{.Values.namespace}}-es1"

service:
  create: false

configmap:
  KAFKA_GROUP_ID: "{{.Values.namespace}}-m2m-event-dispatcher"
  TOPIC_STARTING_OFFSET: "earliest"

externalSecrets:
  flywayInitContainer:
    create: true
    data:
      - secretKey: FLYWAY_USER
        remoteRef:
          key: rds/interop-platform-data-dev/users/flyway_user
          property: username
          version: uuid/terraform-20250318135026647200000005
      - secretKey: FLYWAY_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/flyway_user
          property: password
          version: uuid/terraform-20250318135026647200000005
  app:
    create: true
    data:
      - secretKey: READMODEL_SQL_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_m2m_event_dispatcher_user
          property: username
          version: uuid/terraform-20250925074316887200000004
      - secretKey: READMODEL_SQL_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_m2m_event_dispatcher_user
          property: password
          version: uuid/terraform-20250925074316887200000004
      - secretKey: M2M_EVENT_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_m2m_event_dispatcher_user
          property: username
          version: uuid/terraform-20250925074316887200000004
      - secretKey: M2M_EVENT_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_m2m_event_dispatcher_user
          property: password
          version: uuid/terraform-20250925074316887200000004

deployment:
  flywayInitContainer:
    create: true
    migrationsConfigmap: "flyway-m2m-events"
    env:
      FLYWAY_CREATE_SCHEMAS: "true"
      FLYWAY_PLACEHOLDER_REPLACEMENT: "true"
      FLYWAY_PLACEHOLDERS_NAMESPACE: "{{.Values.namespace}}"
      FLYWAY_URL: "jdbc:postgresql://{{.Values.commons.m2mEventsDb.dbHostRw}}:{{.Values.commons.m2mEventsDb.dbPort}}/{{.Values.commons.m2mEventsDb.dbName}}"
      FLYWAY_SCHEMAS: "{{.Values.commons.m2mEventsDb.dbSchema}}"
      POSTGRES_DB: "{{.Values.commons.m2mEventsDb.dbName}}"
      POSTGRES_HOST: "{{.Values.commons.m2mEventsDb.dbHostRw}}"
      POSTGRES_PORT: "{{.Values.commons.m2mEventsDb.dbPort}}"

  env:
    KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
    AUTHORIZATION_TOPIC: "{{.Values.commons.kafka.authorizationTopic}}"
    AGREEMENT_TOPIC: "{{.Values.commons.kafka.agreementTopic}}"
    PURPOSE_TOPIC: "{{.Values.commons.kafka.purposeTopic}}"
    CATALOG_TOPIC: "{{.Values.commons.kafka.catalogTopic}}"
    ATTRIBUTE_TOPIC: "{{.Values.commons.kafka.attributeTopic}}"
    DELEGATION_TOPIC: "{{.Values.commons.kafka.delegationTopic}}"
    TENANT_TOPIC: "{{.Values.commons.kafka.tenantTopic}}"
    ESERVICE_TEMPLATE_TOPIC: "{{.Values.commons.kafka.eserviceTemplateTopic}}"
    PURPOSE_TEMPLATE_TOPIC: "{{.Values.commons.kafka.purposeTemplateTopic}}"
    READMODEL_SQL_DB_HOST: "{{.Values.commons.readModelSql.dbHostRw}}"
    READMODEL_SQL_DB_PORT: "{{.Values.commons.readModelSql.dbPort}}"
    READMODEL_SQL_DB_NAME: "{{.Values.commons.readModelSql.dbName}}"
    READMODEL_SQL_DB_USE_SSL: "{{.Values.commons.readModelSql.dbUseSsl}}"
    READMODEL_SQL_DB_SCHEMA_AGREEMENT: "{{.Values.commons.readModelSql.dbSchemaAgreement}}"
    READMODEL_SQL_DB_SCHEMA_ATTRIBUTE: "{{.Values.commons.readModelSql.dbSchemaAttribute}}"
    READMODEL_SQL_DB_SCHEMA_CATALOG: "{{.Values.commons.readModelSql.dbSchemaCatalog}}"
    READMODEL_SQL_DB_SCHEMA_CLIENT_JWK_KEY: "{{.Values.commons.readModelSql.dbSchemaClientJwkKey}}"
    READMODEL_SQL_DB_SCHEMA_CLIENT: "{{.Values.commons.readModelSql.dbSchemaClient}}"
    READMODEL_SQL_DB_SCHEMA_DELEGATION: "{{.Values.commons.readModelSql.dbSchemaDelegation}}"
    READMODEL_SQL_DB_SCHEMA_ESERVICE_TEMPLATE: "{{.Values.commons.readModelSql.dbSchemaEserviceTemplate}}"
    READMODEL_SQL_DB_SCHEMA_NOTIFICATION_CONFIG: "{{.Values.commons.readModelSql.dbSchemaNotificationConfig}}"
    READMODEL_SQL_DB_SCHEMA_PRODUCER_JWK_KEY: "{{.Values.commons.readModelSql.dbSchemaProducerJwkKey}}"
    READMODEL_SQL_DB_SCHEMA_PRODUCER_KEYCHAIN: "{{.Values.commons.readModelSql.dbSchemaProducerKeychain}}"
    READMODEL_SQL_DB_SCHEMA_PURPOSE: "{{.Values.commons.readModelSql.dbSchemaPurpose}}"
    READMODEL_SQL_DB_SCHEMA_PURPOSE_TEMPLATE: "{{.Values.commons.readModelSql.dbSchemaPurposeTemplate}}"
    READMODEL_SQL_DB_SCHEMA_TENANT: "{{.Values.commons.readModelSql.dbSchemaTenant}}"
    M2M_EVENT_DB_NAME: "{{.Values.commons.m2mEventsDb.dbName}}"
    M2M_EVENT_DB_HOST: "{{.Values.commons.m2mEventsDb.dbHostRw}}"
    M2M_EVENT_DB_PORT: "{{.Values.commons.m2mEventsDb.dbPort}}"
    M2M_EVENT_DB_USE_SSL: "{{.Values.commons.m2mEventsDb.dbUseSsl}}"
    M2M_EVENT_DB_SCHEMA: "{{.Values.commons.m2mEventsDb.dbSchema}}"
  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
    KAFKA_CLIENT_ID: "metadata.name"
