name: "interop-be-compute-agreements-consumer"
techStack: "nodejs"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-compute-agreements-consumer-{{.Values.namespace}}-es1"

service:
  create: false
  
configmap:
  KAFKA_CLIENT_ID: "{{.Values.namespace}}-pagopa-interop-compute-agreements-consumer"
  KAFKA_GROUP_ID: "{{.Values.namespace}}-compute-agreements-consumer"
  INTERNAL_JWT_KID: "{{.Values.local.interop_be_commons.INTERNAL_KEY_IDENTIFIER}}"
  INTERNAL_JWT_ISSUER: "{{.Values.namespace}}.interop.pagopa.it"
  INTERNAL_JWT_SUBJECT: "{{.Values.namespace}}.interop-m2m"
  INTERNAL_JWT_AUDIENCE: "{{.Values.namespace}}.interop.pagopa.it/internal"
  INTERNAL_JWT_SECONDS_DURATION: "3600"

deployment:
  env:
    TOPIC_STARTING_OFFSET: "latest"
    AGREEMENT_PROCESS_URL: "{{.Values.commons.servicesUrls.agreementProcessUrl}}"
    TENANT_TOPIC: "{{.Values.commons.kafka.tenantTopic}}"
    KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
    FEATURE_FLAG_ATTRIBUTE_CERTIFIED_DISCRETE: "{{.Values.commons.featureFlags.featureFlagAttributeCertifiedDiscrete}}"
  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
