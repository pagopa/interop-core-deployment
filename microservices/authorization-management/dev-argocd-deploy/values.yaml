name: "interop-be-authorization-management"
techStack: "scala"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-iam-service-dev-interop-be-authorization-management-es1"

service:
  create: true
  containerPort: 8088
  additionalPorts:
    - name: monitoring
      containerPort: 9095
      protocol: TCP
      targetPort: monitoring
    - name: management
      containerPort: 8558
      protocol: TCP
      targetPort: management

configmap:
  ACCEPTED_AUDIENCES: "{{.Values.local.env}}.interop.pagopa.it/ui,{{.Values.local.env}}.interop.pagopa.it/m2m,{{.Values.local.env}}.interop.pagopa.it/internal"
  POSTGRES_SCHEMA: "{{.Values.local.env}}_authz"
  POSTGRES_DB: "persistence_management"
  CQRS_PROJECTION_COLLECTION_NAME: "clients"
  CQRS_KEYS_PROJECTION_COLLECTION_NAME: "keys"
  CQRS_CLIENTS_PROJECTION_COLLECTION_NAME: "clients"
  DEV_ENDPOINTS_ENABLED: "{{.Values.local.interop_be_commons.DEV_ENDPOINTS_ENABLED}}"
  ENABLED_PROJECTIONS: "{{.Values.local.interop_be_commons.ENABLED_PROJECTIONS}}"

externalSecrets:
  flywayInitContainer:
    create: true
    data:
      - secretKey: FLYWAY_USER
        remoteRef:
          key: app/backend/postgres
          property: POSTGRES_USR
          version: uuid/3e2fb700-551e-4cd4-86f6-37e2d26bd444
      - secretKey: FLYWAY_PASSWORD
        remoteRef:
          key: app/backend/postgres
          property: POSTGRES_PSW
          version: uuid/3e2fb700-551e-4cd4-86f6-37e2d26bd444
  app:
    create: true
    data:
      - secretKey: POSTGRES_USR
        remoteRef:
          key: app/backend/postgres
          property: POSTGRES_USR
          version: uuid/3e2fb700-551e-4cd4-86f6-37e2d26bd444
      - secretKey: POSTGRES_PSW
        remoteRef:
          key: app/backend/postgres
          property: POSTGRES_PSW
          version: uuid/3e2fb700-551e-4cd4-86f6-37e2d26bd444
      - secretKey: CQRS_PROJECTION_DB_USER
        remoteRef:
          key: app/backend/documentdb
          property: PROJECTION_USR
          version: uuid/c18b6293-6bf1-4e16-9d0e-7ddf93db128f
      - secretKey: CQRS_PROJECTION_DB_PASSWORD
        remoteRef:
          key: app/backend/documentdb
          property: PROJECTION_PSW
          version: uuid/c18b6293-6bf1-4e16-9d0e-7ddf93db128f

deployment:
  replicas: 0
  podTemplateMetadata:
    labels:
      actorSystemName: "{{.Values.name}}"
  securityContext:
    runAsUser: 1001
  flywayInitContainer:
    create: true
    migrationsConfigmap: "common-db-migrations"
    env:
      FLYWAY_CREATE_SCHEMAS: "true"
      FLYWAY_PLACEHOLDER_REPLACEMENT: "true"
      FLYWAY_URL: jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
    envFromConfigmaps:
      FLYWAY_SCHEMAS: "{{.Values.name}}.POSTGRES_SCHEMA"
      FLYWAY_PLACEHOLDERS_APPLICATIONSCHEMA: "{{.Values.name}}.POSTGRES_SCHEMA"
      POSTGRES_DB: "{{.Values.name}}.POSTGRES_DB"
      POSTGRES_HOST: "common-event-store.EVENTSTORE_DB_HOST"
      POSTGRES_PORT: "common-event-store.EVENTSTORE_DB_PORT"
    resources:
      limits:
        cpu: "500m"
        memory: "1Gi"
      requests:
        cpu: "10m"
        memory: "64Mi"
  command: [ "bin/interop-be-authorization-management" ]
  args: [ "-Dconfig.override_with_env_vars=true" ]
  envFromFieldRef:
    NAMESPACE: "metadata.namespace"
  env:
    REQUIRED_CONTACT_POINT_NR: 1
    PERSISTENCE_EVENTS_QUEUE_URL: "https://sqs.eu-south-1.amazonaws.com/{{.Values.local.awsAccountId}}/persistence-events.fifo"
    WELL_KNOWN_URLS: >-
      {{.Values.local.well_known_url.AUTHSRV}}, {{.Values.local.well_known_url.BFF}}, {{.Values.local.well_known_url.INTERNAL}}, {{.Values.local.well_known_url.MAINTENANCE}}
  envFromConfigmaps:
    POSTGRES_HOST: "common-event-store.EVENTSTORE_DB_HOST"
    POSTGRES_PORT: "common-event-store.EVENTSTORE_DB_PORT"
    CQRS_PROJECTION_DB_HOST: "common-read-model.READMODEL_DB_HOST"
    CQRS_PROJECTION_DB_NAME: "common-read-model.READMODEL_DB_NAME"
    CQRS_PROJECTION_DB_PORT: "common-read-model.READMODEL_DB_PORT"
  livenessProbe:
    httpGet:
      path: "/alive"
      port: management
    periodSeconds: 5
    failureThreshold: 3
    initialDelaySeconds: 30
  readinessProbe:
    httpGet:
      path: "/ready"
      port: management
    periodSeconds: 5
    failureThreshold: 3
  resources:
    limits:
      cpu: "500m"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "2Gi"
