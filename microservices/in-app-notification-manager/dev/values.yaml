name: "interop-be-in-app-notification-manager"
techStack: "nodejs"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-in-app-notification-manager-{{.Values.namespace}}-es1"

service:
  create: true
  containerPort: 8088

configmap:
  ACCEPTED_AUDIENCES: "{{.Values.namespace}}.interop.pagopa.it/ui"

externalSecrets:
  flywayInitContainer:
    create: true
    data:
      - secretKey: FLYWAY_USER
        remoteRef:
          key: rds/interop-platform-data-dev/users/flyway_user
          property: username
          version: uuid/terraform-20250318135026647200000005
      - secretKey: FLYWAY_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/flyway_user
          property: password
          version: uuid/terraform-20250318135026647200000005
  app:
    create: true
    data:
      - secretKey: IN_APP_NOTIFICATION_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_in_app_notification_manager_user
          property: username
          version: uuid/terraform-20250930083517549100000002
      - secretKey: IN_APP_NOTIFICATION_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_in_app_notification_manager_user
          property: password
          version: uuid/terraform-20250930083517549100000002

deployment:
  flywayInitContainer:
    create: true
    migrationsConfigmap: "flyway-in-app-notification"
    env:
      FLYWAY_CREATE_SCHEMAS: true
      FLYWAY_PLACEHOLDER_REPLACEMENT: true
      FLYWAY_PLACEHOLDERS_NAMESPACE: "{{.Values.namespace}}"
      FLYWAY_URL: "jdbc:postgresql://{{.Values.commons.inAppNotificationDb.dbHost}}:{{.Values.commons.inAppNotificationDb.dbPort}}/{{.Values.commons.inAppNotificationDb.dbName}}"
      FLYWAY_SCHEMAS: "{{.Values.namespace}}_notification"
      POSTGRES_HOST: "{{.Values.commons.inAppNotificationDb.dbHost}}"
      POSTGRES_PORT: "{{.Values.commons.inAppNotificationDb.dbPort}}"
      POSTGRES_DB: "{{.Values.commons.inAppNotificationDb.dbName}}"
  env:
    PORT: "8088"
    HOST: "0.0.0.0"
    SERVICE_VERSION: "{{.Values.deployment.image.tag}}"
    WELL_KNOWN_URLS: >-
      {{.Values.local.well_known_url.AUTHSRV}}, {{.Values.local.well_known_url.BFF}}
    APPLICATION_AUDIT_TOPIC: "{{.Values.commons.kafka.applicationAuditTopic}}"
    APPLICATION_AUDIT_FALLBACK_SQS_URL: "{{.Values.commons.sqs.applicationAuditFallbackSqsUrl}}"
    PRODUCER_KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
    IN_APP_NOTIFICATION_DB_HOST: "{{.Values.commons.inAppNotificationDb.dbHost}}"
    IN_APP_NOTIFICATION_DB_PORT: "{{.Values.commons.inAppNotificationDb.dbPort}}"
    IN_APP_NOTIFICATION_DB_NAME: "{{.Values.commons.inAppNotificationDb.dbName}}"
    IN_APP_NOTIFICATION_DB_USE_SSL: "{{.Values.commons.inAppNotificationDb.dbUseSsl}}"
    IN_APP_NOTIFICATION_DB_SCHEMA: "{{.Values.commons.inAppNotificationDb.dbSchema}}"
  envFromFieldRef:
    POD_NAME: "metadata.name"
    NODE_IP: "status.hostIP"
    AWS_ROLE_SESSION_NAME: "metadata.name"
    PRODUCER_KAFKA_CLIENT_ID: "metadata.name"
  livenessProbe:
    httpGet:
      path: /status
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /status
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
