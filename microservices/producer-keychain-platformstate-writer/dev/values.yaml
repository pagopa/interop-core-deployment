name: "interop-be-producer-keychain-platformstate-writer"
techStack: "nodejs"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-producer-keychain-platformstate-writer-dev-es1"

service:
  create: false

configmap:
  KAFKA_CLIENT_ID: "{{.Values.namespace}}-pagopa-interop-producer-keychain-platformstate-writer"
  KAFKA_GROUP_ID: "{{.Values.namespace}}-producer-keychain-platformstate-writer"

deployment:
  env:
    TOPIC_STARTING_OFFSET: "earliest"
    AUTHORIZATION_TOPIC: "{{.Values.commons.kafka.authorizationTopic}}"
    KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
    TOKEN_GENERATION_READMODEL_TABLE_NAME_PLATFORM: "{{.Values.commons.tokenGenerationReadModel.tokenReadmodelPlatformStatesTableName}}"
    TOKEN_GENERATION_READMODEL_TABLE_NAME_TOKEN_GENERATION: "{{.Values.commons.tokenGenerationReadModel.tokenReadmodelTokenStatesTableName}}"
    PRODUCER_KEYCHAIN_PLATFORM_STATES_TABLE_NAME: "{{.Values.commons.tokenGenerationReadModel.producerKeychainPlatformStatesTableName}}"
  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
