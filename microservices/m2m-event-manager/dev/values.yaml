name: "interop-be-m2m-event-manager"
techStack: "nodejs"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-m2m-event-manager-{{.Values.namespace}}-es1"

service:
  create: true
  containerPort: 8088

configmap:
  ACCEPTED_AUDIENCES: "{{.Values.namespace}}.interop.pagopa.it/m2m"

externalSecrets:
  flywayInitContainer:
    create: true
    data:
      - secretKey: FLYWAY_USER
        remoteRef:
          key: rds/interop-platform-data-dev/users/flyway_user
          property: username
          version: uuid/terraform-20250318135026647200000005
      - secretKey: FLYWAY_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/flyway_user
          property: password
          version: uuid/terraform-20250318135026647200000005
  app:
    create: true
    data:
      - secretKey: M2M_EVENT_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_m2m_event_manager_user
          property: username
          version: uuid/terraform-20250925074316887200000003
      - secretKey: M2M_EVENT_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_m2m_event_manager_user
          property: password
          version: uuid/terraform-20250925074316887200000003

deployment:
  flywayInitContainer:
    create: true
    migrationsConfigmap: "flyway-m2m-events"
    env:
      FLYWAY_CREATE_SCHEMAS: "true"
      FLYWAY_PLACEHOLDER_REPLACEMENT: "true"
      FLYWAY_PLACEHOLDERS_NAMESPACE: "{{.Values.namespace}}"
      FLYWAY_URL: "jdbc:postgresql://{{.Values.commons.m2mEventsDb.dbHostRw}}:{{.Values.commons.m2mEventsDb.dbPort}}/{{.Values.commons.m2mEventsDb.dbName}}"
      FLYWAY_SCHEMAS: "{{.Values.commons.m2mEventsDb.dbSchema}}"
      POSTGRES_DB: "{{.Values.commons.m2mEventsDb.dbName}}"
      POSTGRES_HOST: "{{.Values.commons.m2mEventsDb.dbHostRw}}"
      POSTGRES_PORT: "{{.Values.commons.m2mEventsDb.dbPort}}"
  env:
    PORT: "8088"
    HOST: "0.0.0.0"
    EVENTSTORE_DB_USE_SSL: "true"
    SERVICE_VERSION: "{{.Values.deployment.image.tag}}"
    WELL_KNOWN_URLS: >-
      {{.Values.local.well_known_url.AUTHSRV}}
    APPLICATION_AUDIT_TOPIC: "{{.Values.commons.kafka.applicationAuditTopic}}"
    APPLICATION_AUDIT_FALLBACK_SQS_URL: "{{.Values.commons.sqs.applicationAuditFallbackSqsUrl}}"
    PRODUCER_KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
    M2M_EVENT_DB_NAME: "{{.Values.commons.m2mEventsDb.dbName}}"
    M2M_EVENT_DB_PORT: "{{.Values.commons.m2mEventsDb.dbPort}}"
    M2M_EVENT_DB_USE_SSL: "{{.Values.commons.m2mEventsDb.dbUseSsl}}"
    M2M_EVENT_DB_SCHEMA: "{{.Values.commons.m2mEventsDb.dbSchema}}"
  envFromFieldRef:
    POD_NAME: "metadata.name"
    NODE_IP: "status.hostIP"
    AWS_ROLE_SESSION_NAME: "metadata.name"
    PRODUCER_KAFKA_CLIENT_ID: "metadata.name"
  envFromConfigmaps:
    M2M_EVENT_DB_HOST: "common-m2m-events-db.DB_HOST_RO"
  livenessProbe:
    httpGet:
      path: /status
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /status
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
