name: "interop-be-m2m-event-manager"
techStack: "nodejs"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-m2m-event-manager-dev-es1"

service:
  create: true
  containerPort: 8088

configmap:
  ACCEPTED_AUDIENCES: "{{.Values.namespace}}.interop.pagopa.it/m2m"

externalSecrets:
  flywayInitContainer:
    create: true
    data:
      - secretKey: FLYWAY_USER
        remoteRef:
          key: rds/interop-platform-data-dev/users/flyway_user
          property: username
          version: terraform-20250318135026647200000005
      - secretKey: FLYWAY_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/flyway_user
          property: password
          version: terraform-20250318135026647200000005
  app:
    create: true
    data:
      - secretKey: M2M_EVENT_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_m2m_event_manager_user
          property: username
          version: terraform-20250925074316887200000003
      - secretKey: M2M_EVENT_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_m2m_event_manager_user
          property: password
          version: terraform-20250925074316887200000003

deployment:
  flywayInitContainer:
    create: true
    migrationsConfigmap: "flyway-m2m-events"
    env:
      FLYWAY_CREATE_SCHEMAS: "true"
      FLYWAY_PLACEHOLDER_REPLACEMENT: "true"
      FLYWAY_PLACEHOLDERS_NAMESPACE: "{{.Values.namespace}}"
      FLYWAY_URL: jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
    envFromConfigmaps:
      FLYWAY_SCHEMAS: "common-m2m-events-db.DB_SCHEMA"
      POSTGRES_DB: "common-m2m-events-db.DB_NAME"
      POSTGRES_HOST: "common-m2m-events-db.DB_HOST_RW"
      POSTGRES_PORT: "common-m2m-events-db.DB_PORT"
  env:
    PORT: "8088"
    HOST: "0.0.0.0"
    EVENTSTORE_DB_USE_SSL: "true"
    SERVICE_VERSION: "{{.Values.deployment.image.tag}}"
    WELL_KNOWN_URLS: >-
      {{.Values.local.well_known_url.AUTHSRV}}
  envFromFieldRef:
    POD_NAME: "metadata.name"
    NODE_IP: "status.hostIP"
    AWS_ROLE_SESSION_NAME: "metadata.name"
    PRODUCER_KAFKA_CLIENT_ID: "metadata.name"
  envFromConfigmaps:
    APPLICATION_AUDIT_TOPIC: "common-kafka.APPLICATION_AUDIT_TOPIC"
    APPLICATION_AUDIT_FALLBACK_SQS_URL: "common-sqs.APPLICATION_AUDIT_FALLBACK_SQS_URL"
    PRODUCER_KAFKA_BROKERS: "common-kafka.KAFKA_BROKERS"
    M2M_EVENT_DB_NAME: "common-m2m-events-db.DB_NAME"
    M2M_EVENT_DB_HOST: "common-m2m-events-db.DB_HOST_RO"
    M2M_EVENT_DB_PORT: "common-m2m-events-db.DB_PORT"
    M2M_EVENT_DB_USE_SSL: "common-m2m-events-db.DB_USE_SSL"
    M2M_EVENT_DB_SCHEMA: "common-m2m-events-db.DB_SCHEMA"
  livenessProbe:
    httpGet:
      path: /status
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /status
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
