name: "interop-be-m2m-gateway-v3"
techStack: "nodejs"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-m2m-gateway-v3-{{.Values.namespace}}-es1"

service:
  create: true
  containerPort: 8088
  albHealthCheck:
    path: /m2m-gateway/v3/status
    port: "8088"
    protocol: HTTP

configmap:
  M2M_GATEWAY_INTERFACE_VERSION: v3
  ACCEPTED_AUDIENCES: "{{.Values.namespace}}.interop.pagopa.it/m2m"
  RATE_LIMITER_MAX_REQUESTS: "9999999"
  RATE_LIMITER_BURST_PERCENTAGE: "1.0"
  RATE_LIMITER_RATE_INTERVAL_MILLIS: "1000"
  RATE_LIMITER_TIMEOUT_MILLIS: "300"
  DEFAULT_POLLING_RETRY_DELAY: "300"
  DEFAULT_POLLING_MAX_RETRIES: "20"
  ESERVICE_DOCUMENTS_CONTAINER: "interop-application-documents-{{.Values.namespace}}-es1"
  ESERVICE_DOCUMENTS_PATH: "eservices/docs"
  ESERVICE_TEMPLATE_DOCUMENTS_CONTAINER: "interop-application-documents-{{.Values.namespace}}-es1"
  ESERVICE_TEMPLATE_DOCUMENTS_PATH: "eservice-template/docs"
  RISK_ANALYSIS_DOCUMENTS_CONTAINER: "interop-application-documents-{{.Values.namespace}}-es1"
  RISK_ANALYSIS_DOCUMENTS_PATH: "{{.Values.namespace}}/risk-analysis/docs"
  AGREEMENT_CONSUMER_DOCUMENTS_CONTAINER: "interop-application-documents-{{.Values.namespace}}-es1"
  AGREEMENT_CONSUMER_DOCUMENTS_PATH: "{{.Values.namespace}}/agreement/consumer-docs"
  AGREEMENT_CONSUMER_CONTRACTS_PATH: "{{.Values.namespace}}/agreement/contracts"
  PURPOSE_TEMPLATE_DOCUMENTS_CONTAINER: "interop-application-documents-{{.Values.namespace}}-es1"
  PURPOSE_TEMPLATE_DOCUMENTS_PATH: "{{.Values.namespace}}/purpose-template/docs"
  DPOP_CACHE_TABLE: "interop-m2m-gateway-dpop-cache-dev"
  DPOP_HTU_BASE: "https://api.dev.interop.pagopa.it/v3"
  DPOP_IAT_TOLERANCE_SECONDS: "10"
  DPOP_DURATION_SECONDS: "60"
  INTEGRITY_REST_JWT_KID: "{{.Values.local.interop_be_commons.INTEGRITY_REST_KEY_IDENTIFIER}}"
  INTEGRITY_REST_JWT_ISSUER: "https://api.dev.interop.pagopa.it"
  INTEGRITY_REST_JWT_SECONDS_DURATION: 100

externalSecrets:
  app:
    create: true
    data:
      - secretKey: SELFCARE_V2_API_KEY
        remoteRef:
          key: app/backend/selfcare-v2
          property: SELFCARE_V2_API_KEY
          version: uuid/833a6680-7f16-45ed-ba65-55c3bd4407d1

deployment:
  env:
    HOST: "0.0.0.0"
    PORT: "8088"
    SERVICE_VERSION: "{{.Values.deployment.image.tag}}"
    KEEP_ALIVE_TIMEOUT_MILLIS: "61000"
    WELL_KNOWN_URLS: >-
      {{.Values.local.well_known_url.AUTHSRV}}
    AGREEMENT_PROCESS_URL: "{{.Values.commons.servicesUrls.agreementProcessUrl}}"
    ATTRIBUTE_REGISTRY_PROCESS_URL: "{{.Values.commons.servicesUrls.attributeRegistryProcessUrl}}"
    AUTHORIZATION_PROCESS_URL: "{{.Values.commons.servicesUrls.authorizationProcessUrl}}"
    CATALOG_PROCESS_URL: "{{.Values.commons.servicesUrls.catalogProcessUrl}}"
    DELEGATION_PROCESS_URL: "{{.Values.commons.servicesUrls.delegationProcessUrl}}"
    ESERVICE_TEMPLATE_PROCESS_URL: "{{.Values.commons.servicesUrls.eserviceTemplateProcessUrl}}"
    PURPOSE_PROCESS_URL: "{{.Values.commons.servicesUrls.purposeProcessUrl}}"
    PURPOSE_TEMPLATE_PROCESS_URL: "{{.Values.commons.servicesUrls.purposeTemplateProcessUrl}}"
    TENANT_PROCESS_URL: "{{.Values.commons.servicesUrls.tenantProcessUrl}}"
    EVENT_MANAGER_URL: "{{.Values.commons.servicesUrls.eventManagerUrl}}"
    APPLICATION_AUDIT_TOPIC: "{{.Values.commons.kafka.applicationAuditTopic}}"
    APPLICATION_AUDIT_FALLBACK_SQS_URL: "{{.Values.commons.sqs.applicationAuditFallbackSqsUrl}}"
    PRODUCER_KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
    RATE_LIMITER_REDIS_HOST: "{{.Values.commons.redis.redisHost}}"
    RATE_LIMITER_REDIS_PORT: "{{.Values.commons.redis.redisPort}}"
    SELFCARE_V2_URL: "{{.Values.commons.selfcare.selfcareV2Url}}"
  envFromFieldRef:
    POD_NAME: "metadata.name"
    NODE_IP: "status.hostIP"
    AWS_ROLE_SESSION_NAME: "metadata.name"
    PRODUCER_KAFKA_CLIENT_ID: "metadata.name"
  livenessProbe:
    httpGet:
      path: "/m2m-gateway/v3/status"
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: "/m2m-gateway/v3/status"
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
