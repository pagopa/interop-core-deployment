name: "interop-be-delegation-process"
techStack: "nodejs"

service:
  create: true
  containerPort: 8088

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-delegation-process-{{.Values.namespace}}-es1"

configmap:
  EVENTSTORE_DB_SCHEMA: "{{.Values.namespace}}_delegation"
  ACCEPTED_AUDIENCES: "{{.Values.namespace}}.interop.pagopa.it/ui,{{.Values.namespace}}.interop.pagopa.it/m2m,{{.Values.namespace}}.interop.pagopa.it/internal"
  S3_BUCKET: "interop-application-documents-{{.Values.namespace}}-es1"
  DELEGATION_DOCUMENTS_PATH: "delegation"
  DELEGATIONS_ALLOWED_ORIGINS: "IPA"
  DELEGATIONS_ALLOWED_ATTRIBUTE_ID: "48621601-1066-422d-aec8-65a19072cfb0"

externalSecrets:
  flywayInitContainer:
    create: true
    data:
      - secretKey: FLYWAY_USER
        remoteRef:
          key: app/backend/event-store
          property: POSTGRES_USR
          version: uuid/6e4e8f69-be18-4c6e-832a-248bfb462151
      - secretKey: FLYWAY_PASSWORD
        remoteRef:
          key: app/backend/event-store
          property: POSTGRES_PSW
          version: uuid/6e4e8f69-be18-4c6e-832a-248bfb462151
  app:
    create: true
    data:
      - secretKey: EVENTSTORE_DB_USERNAME
        remoteRef:
          key: app/backend/event-store
          property: POSTGRES_USR
          version: uuid/6e4e8f69-be18-4c6e-832a-248bfb462151
      - secretKey: EVENTSTORE_DB_PASSWORD
        remoteRef:
          key: app/backend/event-store
          property: POSTGRES_PSW
          version: uuid/6e4e8f69-be18-4c6e-832a-248bfb462151
      - secretKey: READMODEL_DB_USERNAME
        remoteRef:
          key: app/backend/read-model
          property: READONLY_USR
          version: uuid/d64e70da-6e72-41d0-84b1-b2c705e02574
      - secretKey: READMODEL_DB_PASSWORD
        remoteRef:
          key: app/backend/read-model
          property: READONLY_PSW
          version: uuid/d64e70da-6e72-41d0-84b1-b2c705e02574
      - secretKey: READMODEL_SQL_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_delegation_process_user
          property: username
          version: uuid/terraform-20250415162233162400000008
      - secretKey: READMODEL_SQL_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_delegation_process_user
          property: password
          version: uuid/terraform-20250415162233162400000008

deployment:
  flywayInitContainer:
    create: true
    migrationsConfigmap: "event-store-migrations"
    env:
      FLYWAY_CREATE_SCHEMAS: "true"
      FLYWAY_PLACEHOLDER_REPLACEMENT: "true"
      FLYWAY_URL: "jdbc:postgresql://{{.Values.commons.eventStore.eventstoreDbHost}}:{{.Values.commons.eventStore.eventstoreDbPort}}/{{.Values.commons.eventStore.eventstoreDbName}}"
      POSTGRES_HOST: "{{.Values.commons.eventStore.eventstoreDbHost}}"
      POSTGRES_PORT: "{{.Values.commons.eventStore.eventstoreDbPort}}"
      POSTGRES_DB: "{{.Values.commons.eventStore.eventstoreDbName}}"
    envFromConfigmaps:
      FLYWAY_SCHEMAS: "{{.Values.name}}.EVENTSTORE_DB_SCHEMA"
      FLYWAY_PLACEHOLDERS_APPLICATIONSCHEMA: "{{.Values.name}}.EVENTSTORE_DB_SCHEMA"
  env:
    PORT: "8088"
    HOST: "0.0.0.0"
    EVENTSTORE_DB_USE_SSL: "true"
    SERVICE_VERSION: "{{.Values.deployment.image.tag}}"
    WELL_KNOWN_URLS: >-
      {{.Values.local.well_known_url.AUTHSRV}}, {{.Values.local.well_known_url.BFF}}, {{.Values.local.well_known_url.INTERNAL}}, {{.Values.local.well_known_url.MAINTENANCE}}
    EVENTSTORE_DB_HOST: "{{.Values.commons.eventStore.eventstoreDbHost}}"
    EVENTSTORE_DB_NAME: "{{.Values.commons.eventStore.eventstoreDbName}}"
    EVENTSTORE_DB_PORT: "{{.Values.commons.eventStore.eventstoreDbPort}}"
    READMODEL_DB_HOST: "{{.Values.commons.readModel.readmodelDbHost}}"
    READMODEL_DB_NAME: "{{.Values.commons.readModel.readmodelDbName}}"
    READMODEL_DB_PORT: "{{.Values.commons.readModel.readmodelDbPort}}"
    APPLICATION_AUDIT_TOPIC: "{{.Values.commons.kafka.applicationAuditTopic}}"
    APPLICATION_AUDIT_FALLBACK_SQS_URL: "{{.Values.commons.sqs.applicationAuditFallbackSqsUrl}}"
    PRODUCER_KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
    READMODEL_SQL_DB_HOST: "{{.Values.commons.readModelSql.dbHostRo}}"
    READMODEL_SQL_DB_PORT: "{{.Values.commons.readModelSql.dbPort}}"
    READMODEL_SQL_DB_NAME: "{{.Values.commons.readModelSql.dbName}}"
    READMODEL_SQL_DB_USE_SSL: "{{.Values.commons.readModelSql.dbUseSsl}}"
    READMODEL_SQL_DB_SCHEMA_AGREEMENT: "{{.Values.commons.readModelSql.dbSchemaAgreement}}"
    READMODEL_SQL_DB_SCHEMA_ATTRIBUTE: "{{.Values.commons.readModelSql.dbSchemaAttribute}}"
    READMODEL_SQL_DB_SCHEMA_CATALOG: "{{.Values.commons.readModelSql.dbSchemaCatalog}}"
    READMODEL_SQL_DB_SCHEMA_CLIENT_JWK_KEY: "{{.Values.commons.readModelSql.dbSchemaClientJwkKey}}"
    READMODEL_SQL_DB_SCHEMA_CLIENT: "{{.Values.commons.readModelSql.dbSchemaClient}}"
    READMODEL_SQL_DB_SCHEMA_DELEGATION: "{{.Values.commons.readModelSql.dbSchemaDelegation}}"
    READMODEL_SQL_DB_SCHEMA_ESERVICE_TEMPLATE: "{{.Values.commons.readModelSql.dbSchemaEserviceTemplate}}"
    READMODEL_SQL_DB_SCHEMA_NOTIFICATION_CONFIG: "{{.Values.commons.readModelSql.dbSchemaNotificationConfig}}"
    READMODEL_SQL_DB_SCHEMA_PRODUCER_JWK_KEY: "{{.Values.commons.readModelSql.dbSchemaProducerJwkKey}}"
    READMODEL_SQL_DB_SCHEMA_PRODUCER_KEYCHAIN: "{{.Values.commons.readModelSql.dbSchemaProducerKeychain}}"
    READMODEL_SQL_DB_SCHEMA_PURPOSE: "{{.Values.commons.readModelSql.dbSchemaPurpose}}"
    READMODEL_SQL_DB_SCHEMA_PURPOSE_TEMPLATE: "{{.Values.commons.readModelSql.dbSchemaPurposeTemplate}}"
    READMODEL_SQL_DB_SCHEMA_TENANT: "{{.Values.commons.readModelSql.dbSchemaTenant}}"
    FEATURE_FLAG_SQL: "{{.Values.commons.featureFlags.featureFlagSql}}"
  envFromFieldRef:
    POD_NAME: "metadata.name"
    NODE_IP: "status.hostIP"
    AWS_ROLE_SESSION_NAME: "metadata.name"
    PRODUCER_KAFKA_CLIENT_ID: "metadata.name"
  livenessProbe:
    httpGet:
      path: /status
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /status
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
