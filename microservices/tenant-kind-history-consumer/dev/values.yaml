name: interop-be-tenant-kind-history-consumer
techStack: nodejs

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-tenant-kind-history-consumer-{{.Values.namespace}}-es1"

service:
  create: false

configmap:
  KAFKA_GROUP_ID: "{{.Values.namespace}}-tenant-kind-history-consumer"
  TOPIC_STARTING_OFFSET: "earliest"

externalSecrets:
  flywayInitContainer:
    create: true
    data:
      - secretKey: FLYWAY_USER
        remoteRef:
          key: rds/interop-platform-data-dev/users/flyway_user
          property: username
          version: uuid/terraform-20250318135026647200000005
      - secretKey: FLYWAY_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/flyway_user
          property: password
          version: uuid/terraform-20250318135026647200000005
  app:
    create: true
    data:
      - secretKey: TENANT_KIND_HISTORY_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_tenant_kind_history_consumer_user
          property: username
          version: uuid/terraform-20260522092912718200000005
      - secretKey: TENANT_KIND_HISTORY_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_tenant_kind_history_consumer_user
          property: password
          version: uuid/terraform-20260522092912718200000005

deployment:
  flywayInitContainer:
    create: true
    migrationsConfigmap: "flyway-tenant-kind-history"
    env:
      FLYWAY_CREATE_SCHEMAS: "true"
      FLYWAY_PLACEHOLDER_REPLACEMENT: "true"
      FLYWAY_PLACEHOLDERS_NAMESPACE: "{{.Values.namespace}}"
      FLYWAY_URL: "jdbc:postgresql://$(POSTGRES_HOST):{{.Values.commons.tenantKindHistoryDb.dbPort}}/{{.Values.commons.tenantKindHistoryDb.dbName}}"
      FLYWAY_SCHEMAS: "{{.Values.commons.tenantKindHistoryDb.dbSchema}}"
      POSTGRES_DB: "{{.Values.commons.tenantKindHistoryDb.dbName}}"
      POSTGRES_PORT: "{{.Values.commons.tenantKindHistoryDb.dbPort}}"
    envFromConfigmaps:
      POSTGRES_HOST: "common-tenant-kind-history-db.DB_HOST_RW"

  env:
    KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
    TENANT_TOPIC: "{{.Values.commons.kafka.tenantTopic}}"
    TENANT_KIND_HISTORY_DB_PORT: "{{.Values.commons.tenantKindHistoryDb.dbPort}}"
    TENANT_KIND_HISTORY_DB_NAME: "{{.Values.commons.tenantKindHistoryDb.dbName}}"
    TENANT_KIND_HISTORY_DB_USE_SSL: "{{.Values.commons.tenantKindHistoryDb.dbUseSsl}}"
    TENANT_KIND_HISTORY_DB_SCHEMA: "{{.Values.commons.tenantKindHistoryDb.dbSchema}}"
  envFromConfigmaps:
    TENANT_KIND_HISTORY_DB_HOST: "common-tenant-kind-history-db.DB_HOST_RW"
  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
    KAFKA_CLIENT_ID: "metadata.name"
