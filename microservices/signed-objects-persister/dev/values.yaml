name: interop-be-signed-objects-persister
techStack: nodejs

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-signed-objects-persister-{{.Values.namespace}}-es1"

service:
  create: false

configmap:
  SQS_MAX_NUMBER_OF_MSGS: "5"
  SQS_LONG_POLL_WAIT_TIME_SECONDS: "20"
  SQS_VISIBILITY_TIMEOUT_SECONDS: "20"
  S3_BUCKET_SIGNED_DOCUMENTS: "interop-signed-application-documents-v2-{{.Values.local.env}}-es1"
  S3_BUCKET_EVENTS: "interop-signed-domain-events-v2-{{.Values.local.env}}-es1"
  S3_BUCKET_AUDIT: "interop-signed-jwt-audit-v2-{{.Values.local.env}}-es1"
  S3_BUCKET_M2M_AUDIT: "interop-signed-m2m-jwt-audit-v2-{{.Values.local.env}}-es1"
  SQS_URL: "https://sqs.eu-south-1.amazonaws.com/{{.Values.local.awsAccountId}}/interop-safe-storage-completed-tasks-{{.Values.namespace}}"
  SAFE_STORAGE_CLIENT_ID: "interop-{{.Values.namespace}}-signed-objects-persister"
  INTERNAL_JWT_KID: "{{.Values.local.interop_be_commons.INTERNAL_KEY_IDENTIFIER}}"
  INTERNAL_JWT_SUBJECT: "{{.Values.namespace}}.interop-signed-objects-persister"
  INTERNAL_JWT_ISSUER: "{{.Values.namespace}}.interop.pagopa.it"
  INTERNAL_JWT_AUDIENCE: "{{.Values.namespace}}.interop.pagopa.it/internal"
  INTERNAL_JWT_SECONDS_DURATION: "3600"

externalSecrets:
  app:
    create: true
    data:
      - secretKey: SAFE_STORAGE_API_KEY
        remoteRef:
          key: app/backend/safe-storage-signing-credentials
          property: password
          version: uuid/5ee4c5b8-5efa-43a2-9fe9-7768484451a6

deployment:
  env:
    SAFE_STORAGE_BASE_URL: "{{.Values.commons.safeStorage.baseUrl}}"
    SAFE_STORAGE_DOC_TYPE: "{{.Values.commons.safeStorage.docType}}"
    SAFE_STORAGE_DOC_STATUS: "{{.Values.commons.safeStorage.docStatus}}"
    SIGNATURE_REFERENCES_TABLE_NAME: "{{.Values.commons.safeStorage.liveRequestsDynamoTableName}}"
    AGREEMENT_PROCESS_URL: "{{.Values.commons.servicesUrls.agreementProcessUrl}}"
    DELEGATION_PROCESS_URL: "{{.Values.commons.servicesUrls.delegationProcessUrl}}"
    PURPOSE_PROCESS_URL: "{{.Values.commons.servicesUrls.purposeProcessUrl}}"
    PURPOSE_TEMPLATE_PROCESS_URL: "{{.Values.commons.servicesUrls.purposeTemplateProcessUrl}}"

  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
