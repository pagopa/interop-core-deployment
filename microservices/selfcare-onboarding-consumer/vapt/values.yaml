name: "interop-be-selfcare-onboarding-consumer"
techStack: "nodejs"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-selfcare-onboarding-consumer-{{.Values.namespace}}-es1"

service:
  create: false

configmap:
  KAFKA_BROKERS: "selc-u-eventhub-ns.servicebus.windows.net:9093"
  KAFKA_CLIENT_ID: "interop-{{.Values.namespace}}"
  KAFKA_GROUP_ID: "interop-onboarding-{{.Values.namespace}}"
  SELFCARE_TOPIC: "sc-contracts"
  RESET_CONSUMER_OFFSETS: "FALSE"
  INTEROP_PRODUCT: "prod-interop-atst"
  ALLOWED_ORIGINS: "IPA,ANAC,IVASS,INFOCAMERE,SELC,SELC-PT,PDND_INFOCAMERE-SCP,PDND_INFOCAMERE-PRV,PDND_INFOCAMERE-PT,INFOCAMERE-PT,PDND_INFOCAMERE"
  INTERNAL_JWT_KID: "{{.Values.local.interop_be_commons.INTERNAL_KEY_IDENTIFIER}}"
  INTERNAL_JWT_SUBJECT: "{{.Values.namespace}}.interop-m2m"
  INTERNAL_JWT_ISSUER: "{{.Values.namespace}}.interop.pagopa.it"
  INTERNAL_JWT_AUDIENCE: "{{.Values.namespace}}.interop.pagopa.it/internal"
  INTERNAL_JWT_SECONDS_DURATION: "3600"

externalSecrets:
  app:
    create: true
    data:
      - secretKey: KAFKA_BROKER_CONNECTION_STRING
        remoteRef:
          key: app/backend/selfcare-v2
          property: SELFCARE_BROKER_CONNECTION_STRING
          version: uuid/e6b4391e-1932-45a8-85bc-cb1bea2af272

deployment:
  replicas: 0
  envFromConfigmaps:
    TENANT_PROCESS_URL: "common-services-urls.TENANT_PROCESS_URL"
