name: "interop-be-notifier-seeder"
techStack: "nodejs"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-notifier-seeder-{{.Values.namespace}}-es1"

service:
  create: false

configmap:
  KAFKA_CLIENT_ID: "{{.Values.namespace}}-pagopa-interop-notifier-seeder"
  KAFKA_GROUP_ID: "{{.Values.namespace}}-notifier-seeder"
  NOTIFICATION_QUEUE_URL: "https://sqs.eu-south-1.amazonaws.com/{{.Values.local.awsAccountId}}/persistence-events.fifo"

deployment:
  env:
    TOPIC_STARTING_OFFSET: "latest"
    AGREEMENT_TOPIC: "{{.Values.commons.kafka.agreementTopic}}"
    AUTHORIZATION_TOPIC: "{{.Values.commons.kafka.authorizationTopic}}"
    CATALOG_TOPIC: "{{.Values.commons.kafka.catalogTopic}}"
    PURPOSE_TOPIC: "{{.Values.commons.kafka.purposeTopic}}"
    KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
