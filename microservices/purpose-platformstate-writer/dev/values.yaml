name: "interop-be-purpose-platformstate-writer"
techStack: "nodejs"

serviceAccount:
  roleArn: "arn:aws:iam::505630707203:role/interop-be-purpose-platformstate-writer-dev-es1"

service:
  create: false

configmap:
  KAFKA_CLIENT_ID: "{{.Values.namespace}}-pagopa-interop-purpose-platformstate-writer"
  KAFKA_GROUP_ID: "{{.Values.namespace}}-purpose-platformstate-writer"

deployment:
  env:
    TOPIC_STARTING_OFFSET: "earliest"
    PURPOSE_TOPIC: "{{.Values.commons.kafka.purposeTopic}}"
    KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
    TOKEN_GENERATION_READMODEL_TABLE_NAME_PLATFORM: "{{.Values.commons.tokenGenerationReadModel.tokenReadmodelPlatformStatesTableName}}"
    TOKEN_GENERATION_READMODEL_TABLE_NAME_TOKEN_GENERATION: "{{.Values.commons.tokenGenerationReadModel.tokenReadmodelTokenStatesTableName}}"
  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
 
 