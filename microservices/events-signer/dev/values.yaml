name: interop-be-events-signer
techStack: nodejs

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-events-signer-{{.Values.namespace}}-es1"

service:
  create: false

configmap:
  KAFKA_GROUP_ID: "{{.Values.local.env}}-events-signer"
  AVERAGE_KAFKA_MESSAGE_SIZE_IN_BYTES: "5000"
  MESSAGES_TO_READ_PER_BATCH: "500"
  MAX_WAIT_KAFKA_BATCH_MILLIS: "5000"
  TOPIC_STARTING_OFFSET: "earliest"
  SAFE_STORAGE_CLIENT_ID: "interop-{{.Values.namespace}}-events-signer"
  S3_BUCKET: "interop-domain-events-{{.Values.local.env}}-es1"

externalSecrets:
  app:
    create: true
    data:
      - secretKey: SAFE_STORAGE_API_KEY
        remoteRef:
          key: app/backend/safe-storage-signing-credentials
          property: password
          version: uuid/5ee4c5b8-5efa-43a2-9fe9-7768484451a6

deployment:
  env:
    AGREEMENT_TOPIC: "{{.Values.commons.kafka.agreementTopic}}"
    AUTHORIZATION_TOPIC: "{{.Values.commons.kafka.authorizationTopic}}"
    CATALOG_TOPIC: "{{.Values.commons.kafka.catalogTopic}}"
    DELEGATION_TOPIC: "{{.Values.commons.kafka.delegationTopic}}"
    PURPOSE_TOPIC: "{{.Values.commons.kafka.purposeTopic}}"
    PURPOSE_TEMPLATE_TOPIC: "{{.Values.commons.kafka.purposeTemplateTopic}}"
    KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
    SAFE_STORAGE_BASE_URL: "{{.Values.commons.safeStorage.baseUrl}}"
    SAFE_STORAGE_DOC_TYPE: "{{.Values.commons.safeStorage.docType}}"
    SAFE_STORAGE_DOC_STATUS: "{{.Values.commons.safeStorage.docStatus}}"
    SIGNATURE_REFERENCES_TABLE_NAME: "{{.Values.commons.safeStorage.liveRequestsDynamoTableName}}"

  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
    KAFKA_CLIENT_ID: "metadata.name"
