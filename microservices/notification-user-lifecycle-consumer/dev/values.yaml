name: interop-be-notification-user-lifecycle-consumer
techStack: nodejs

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-notification-user-lifecycle-consumer-{{.Values.namespace}}-es1"

service:
  create: false

configmap:
  KAFKA_GROUP_ID: "{{.Values.namespace}}-notification-user-lifecycle-consumer"
  TOPIC_STARTING_OFFSET: "latest"
  INTERNAL_JWT_KID: "{{.Values.local.interop_be_commons.INTERNAL_KEY_IDENTIFIER}}"
  INTERNAL_JWT_SUBJECT: "{{.Values.namespace}}.interop-m2m"
  INTERNAL_JWT_ISSUER: "{{.Values.namespace}}.interop.pagopa.it"
  INTERNAL_JWT_AUDIENCE: "{{.Values.namespace}}.interop.pagopa.it/internal"
  INTERNAL_JWT_SECONDS_DURATION: "1800"
  INTEROP_PRODUCT: "prod-interop"

externalSecrets:
  app:
    create: true
    data:
      - secretKey: READMODEL_SQL_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_notification_user_lifecycle_consumer_user
          property: username
          version: uuid/terraform-20251112151244723300000005
      - secretKey: READMODEL_SQL_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_notification_user_lifecycle_consumer_user
          property: password
          version: uuid/terraform-20251112151244723300000005
      - secretKey: KAFKA_BROKER_CONNECTION_STRING
        remoteRef:
          key: app/backend/selfcare-v2
          property: SELFCARE_USERS_BROKER_CONNECTION_STRING
          version: uuid/833a6680-7f16-45ed-ba65-55c3bd4407d1

deployment:
  env:
    KAFKA_BROKERS: "{{.Values.commons.selfcare.selfcareKafkaBrokers}}"
    NOTIFICATION_CONFIG_PROCESS_URL: "{{.Values.commons.servicesUrls.notificationConfigProcessUrl}}"
    READMODEL_SQL_DB_HOST: "{{.Values.commons.readModelSql.dbHostRo}}"
    READMODEL_SQL_DB_PORT: "{{.Values.commons.readModelSql.dbPort}}"
    READMODEL_SQL_DB_NAME: "{{.Values.commons.readModelSql.dbName}}"
    READMODEL_SQL_DB_USE_SSL: "{{.Values.commons.readModelSql.dbUseSsl}}"
    READMODEL_SQL_DB_SCHEMA_AGREEMENT: "{{.Values.commons.readModelSql.dbSchemaAgreement}}"
    READMODEL_SQL_DB_SCHEMA_ATTRIBUTE: "{{.Values.commons.readModelSql.dbSchemaAttribute}}"
    READMODEL_SQL_DB_SCHEMA_CATALOG: "{{.Values.commons.readModelSql.dbSchemaCatalog}}"
    READMODEL_SQL_DB_SCHEMA_CLIENT_JWK_KEY: "{{.Values.commons.readModelSql.dbSchemaClientJwkKey}}"
    READMODEL_SQL_DB_SCHEMA_CLIENT: "{{.Values.commons.readModelSql.dbSchemaClient}}"
    READMODEL_SQL_DB_SCHEMA_DELEGATION: "{{.Values.commons.readModelSql.dbSchemaDelegation}}"
    READMODEL_SQL_DB_SCHEMA_ESERVICE_TEMPLATE: "{{.Values.commons.readModelSql.dbSchemaEserviceTemplate}}"
    READMODEL_SQL_DB_SCHEMA_NOTIFICATION_CONFIG: "{{.Values.commons.readModelSql.dbSchemaNotificationConfig}}"
    READMODEL_SQL_DB_SCHEMA_PRODUCER_JWK_KEY: "{{.Values.commons.readModelSql.dbSchemaProducerJwkKey}}"
    READMODEL_SQL_DB_SCHEMA_PRODUCER_KEYCHAIN: "{{.Values.commons.readModelSql.dbSchemaProducerKeychain}}"
    READMODEL_SQL_DB_SCHEMA_PURPOSE: "{{.Values.commons.readModelSql.dbSchemaPurpose}}"
    READMODEL_SQL_DB_SCHEMA_PURPOSE_TEMPLATE: "{{.Values.commons.readModelSql.dbSchemaPurposeTemplate}}"
    READMODEL_SQL_DB_SCHEMA_TENANT: "{{.Values.commons.readModelSql.dbSchemaTenant}}"
    SELFCARE_TOPIC: "{{.Values.commons.selfcare.selfcareUsersTopic}}"
  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
    KAFKA_CLIENT_ID: "metadata.name"
