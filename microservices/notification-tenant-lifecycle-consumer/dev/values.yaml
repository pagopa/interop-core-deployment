name: interop-be-notification-tenant-lifecycle-consumer
techStack: nodejs

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-notification-tenant-lifecycle-consumer-{{.Values.namespace}}-es1"

service:
  create: false

configmap:
  KAFKA_GROUP_ID: "{{.Values.namespace}}-notification-tenant-lifecycle-consumer"
  TOPIC_STARTING_OFFSET: "earliest"
  INTERNAL_JWT_KID: "{{.Values.local.interop_be_commons.INTERNAL_KEY_IDENTIFIER}}"
  INTERNAL_JWT_SUBJECT: "{{.Values.namespace}}.interop-m2m"
  INTERNAL_JWT_ISSUER: "{{.Values.namespace}}.interop.pagopa.it"
  INTERNAL_JWT_AUDIENCE: "{{.Values.namespace}}.interop.pagopa.it/internal"
  INTERNAL_JWT_SECONDS_DURATION: "1800"

deployment:
  replicas: 0
  env:
    KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
    TENANT_TOPIC: "{{.Values.commons.kafka.tenantTopic}}"
    NOTIFICATION_CONFIG_PROCESS_URL: "{{.Values.commons.servicesUrls.notificationConfigProcessUrl}}"
  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
    KAFKA_CLIENT_ID: "metadata.name"
