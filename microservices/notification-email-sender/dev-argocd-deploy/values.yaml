name: "interop-be-notification-email-sender"
techStack: "nodejs"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-notification-email-sender-dev-es1"

service:
  create: false

configmap:
  INTEROP_FE_BASE_URL: "selfcare.{{.Values.local.env}}.interop.pagopa.it"
  AWS_SES_ENDPOINT: "http://ses-mock.{{.Values.local.env}}.svc.cluster.local:8005"
  SENDER_MAIL: "noreply@notifiche.{{.Values.local.env}}.interop.pagopa.it"
  SENDER_LABEL: "noreply-{{.Values.local.env}}"
  KAFKA_GROUP_ID: "{{.Values.local.env}}-notification-email-sender"
  KAFKA_CLIENT_ID: "{{.Values.local.env}}-pagopa-interop-notification-email-sender"
  REDIS_NOTIFICATION_EMAIL_SENDER_TTL_SECONDS: "2592000"
  SMTP_ADDRESS: "smtp-mock.{{.Values.local.env}}.svc.cluster.local"
  SMTP_PORT: "5025"
  SMTP_SECURE: "false"

externalSecrets:
  app:
    create: true
    data:
      - secretKey: READMODEL_DB_USERNAME
        remoteRef:
          key: app/backend/read-model
          property: READONLY_USR
          version: uuid/d64e70da-6e72-41d0-84b1-b2c705e02574
      - secretKey: READMODEL_DB_PASSWORD
        remoteRef:
          key: app/backend/read-model
          property: READONLY_PSW
          version: uuid/d64e70da-6e72-41d0-84b1-b2c705e02574
      - secretKey: SMTP_USERNAME
        remoteRef:
          key: app/backend/smtp-notifications
          property: SMTP_USER
          version: uuid/e3023fd6-ae5d-407f-bde1-a3b70d22c1ac
      - secretKey: SMTP_PASSWORD
        remoteRef:
          key: app/backend/smtp-notifications
          property: SMTP_PASSWORD
          version: uuid/e3023fd6-ae5d-407f-bde1-a3b70d22c1ac
      - secretKey: READMODEL_SQL_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_notification_email_sender_user
          property: username
          version: uuid/terraform-20250610121723506800000010
      - secretKey: READMODEL_SQL_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_notification_email_sender_user
          property: password
          version: uuid/terraform-20250610121723506800000010

deployment:
  env:
    TOPIC_STARTING_OFFSET: "latest"
  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
  envFromConfigmaps:
    AGREEMENT_TOPIC: "common-kafka.AGREEMENT_TOPIC"
    CATALOG_TOPIC: "common-kafka.CATALOG_TOPIC"
    PURPOSE_TOPIC: "common-kafka.PURPOSE_TOPIC"
    KAFKA_BROKERS: "common-kafka.KAFKA_BROKERS"
    READMODEL_DB_HOST: "common-read-model.READMODEL_DB_HOST"
    READMODEL_DB_NAME: "common-read-model.READMODEL_DB_NAME"
    READMODEL_DB_PORT: "common-read-model.READMODEL_DB_PORT"
    READMODEL_SQL_DB_HOST: "common-read-model-sql.DB_HOST_RO"
    READMODEL_SQL_DB_PORT: "common-read-model-sql.DB_PORT"
    READMODEL_SQL_DB_NAME: "common-read-model-sql.DB_NAME"
    READMODEL_SQL_DB_USE_SSL: "common-read-model-sql.DB_USE_SSL"
    READMODEL_SQL_DB_SCHEMA_AGREEMENT: "common-read-model-sql.DB_SCHEMA_AGREEMENT"
    READMODEL_SQL_DB_SCHEMA_ATTRIBUTE: "common-read-model-sql.DB_SCHEMA_ATTRIBUTE"
    READMODEL_SQL_DB_SCHEMA_CATALOG: "common-read-model-sql.DB_SCHEMA_CATALOG"
    READMODEL_SQL_DB_SCHEMA_CLIENT_JWK_KEY: "common-read-model-sql.DB_SCHEMA_CLIENT_JWK_KEY"
    READMODEL_SQL_DB_SCHEMA_CLIENT: "common-read-model-sql.DB_SCHEMA_CLIENT"
    READMODEL_SQL_DB_SCHEMA_DELEGATION: "common-read-model-sql.DB_SCHEMA_DELEGATION"
    READMODEL_SQL_DB_SCHEMA_ESERVICE_TEMPLATE: "common-read-model-sql.DB_SCHEMA_ESERVICE_TEMPLATE"
    READMODEL_SQL_DB_SCHEMA_NOTIFICATION_CONFIG: "common-read-model-sql.DB_SCHEMA_NOTIFICATION_CONFIG"
    READMODEL_SQL_DB_SCHEMA_PRODUCER_JWK_KEY: "common-read-model-sql.DB_SCHEMA_PRODUCER_JWK_KEY"
    READMODEL_SQL_DB_SCHEMA_PRODUCER_KEYCHAIN: "common-read-model-sql.DB_SCHEMA_PRODUCER_KEYCHAIN"
    READMODEL_SQL_DB_SCHEMA_PURPOSE: "common-read-model-sql.DB_SCHEMA_PURPOSE"
    READMODEL_SQL_DB_SCHEMA_PURPOSE_TEMPLATE: "common-read-model-sql.DB_SCHEMA_PURPOSE_TEMPLATE"
    READMODEL_SQL_DB_SCHEMA_TENANT: "common-read-model-sql.DB_SCHEMA_TENANT"
    FEATURE_FLAG_SQL: "common-feature-flags.FEATURE_FLAG_SQL"
    REDIS_NOTIFICATION_EMAIL_SENDER_HOST: "common-redis.REDIS_HOST"
    REDIS_NOTIFICATION_EMAIL_SENDER_PORT: "common-redis.REDIS_PORT"
  resources:
    limits:
      cpu: "500m"
      memory: "1Gi"
    requests:
      cpu: "500m"
      memory: "1Gi"
