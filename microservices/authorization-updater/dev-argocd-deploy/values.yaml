name: "interop-be-authorization-updater"
techStack: "nodejs"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-authorization-updater-dev-es1"

service:
  create: false

configmap:
  KAFKA_CLIENT_ID: "{{.Values.local.env}}-pagopa-interop-authorization-updater"
  KAFKA_GROUP_ID: "{{.Values.local.env}}-authorization-updater"
  INTERNAL_JWT_KID: "{{.Values.local.interop_be_commons.INTERNAL_KEY_IDENTIFIER}}"
  INTERNAL_JWT_ISSUER: "{{.Values.local.env}}.interop.pagopa.it"
  INTERNAL_JWT_AUDIENCE: "{{.Values.local.env}}.interop.pagopa.it/internal"
  INTERNAL_JWT_SECONDS_DURATION: "3600"
  INTERNAL_JWT_SUBJECT: "{{.Values.local.env}}.interop-m2m"

externalSecrets:
  app:
    create: true
    data:
      - secretKey: READMODEL_DB_USERNAME
        remoteRef:
          key: app/backend/read-model
          property: READONLY_USR
          version: uuid/d64e70da-6e72-41d0-84b1-b2c705e02574
      - secretKey: READMODEL_DB_PASSWORD
        remoteRef:
          key: app/backend/read-model
          property: READONLY_PSW
          version: uuid/d64e70da-6e72-41d0-84b1-b2c705e02574

deployment:
  replicas: 0
  env:
    TOPIC_STARTING_OFFSET: "latest"
  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
  envFromConfigmaps:
    KAFKA_BROKERS: "common-kafka.KAFKA_BROKERS"
    AGREEMENT_TOPIC: "common-kafka.AGREEMENT_TOPIC"
    CATALOG_TOPIC: "common-kafka.CATALOG_TOPIC"
    PURPOSE_TOPIC: "common-kafka.PURPOSE_TOPIC"
    AUTHORIZATION_TOPIC: "common-kafka.AUTHORIZATION_TOPIC"
    AUTHORIZATION_MANAGEMENT_URL: "common-services-urls.AUTHORIZATION_MANAGEMENT_URL"
    READMODEL_DB_HOST: "common-read-model.READMODEL_DB_HOST"
    READMODEL_DB_NAME: "common-read-model.READMODEL_DB_NAME"
    READMODEL_DB_PORT: "common-read-model.READMODEL_DB_PORT"
