name: "interop-be-authorization-server-node"
techStack: "nodejs"

serviceAccount:
  roleArn: "arn:aws:iam::505630707203:role/interop-be-authorization-server-dev-es1"

service:
  create: true
  containerPort: 8088
  albHealthCheck:
    path: "/authorization-server/status"
    port: "8088"
    protocol: "HTTP"

configmap:
  AUDIT_FALLBACK_S3_BUCKET: "interop-generated-jwt-details-fallback-{{.Values.namespace}}-es1"
  DPOP_CACHE_TABLE: "interop-dpop-cache-dev"
  DPOP_HTU_BASE: "https://auth.dev.interop.pagopa.it/token.oauth2"
  DPOP_DURATION_SECONDS: "60"
  DPOP_IAT_TOLERANCE_SECONDS: "10"
  S3_BUCKET_CONSUMER_TOKEN_AUDIT_FALLBACK: "interop-generated-jwt-details-fallback-{{.Values.namespace}}-es1"
  S3_BUCKET_API_TOKEN_AUDIT_FALLBACK: "interop-generated-m2m-jwt-details-fallback-{{.Values.namespace}}-es1"
  GENERATED_INTEROP_TOKEN_KID: "{{.Values.local.interop_be_commons.AUTHSRV_KEY_IDENTIFIER}}"
  GENERATED_INTEROP_TOKEN_ISSUER: "{{.Values.namespace}}.interop.pagopa.it"
  GENERATED_INTEROP_TOKEN_M2M_AUDIENCE: "{{.Values.namespace}}.interop.pagopa.it/m2m"
  GENERATED_INTEROP_TOKEN_M2M_DURATION_SECONDS: "28800"
  CLIENT_ASSERTION_JWT_AUDIENCE: "auth.{{.Values.namespace}}.interop.pagopa.it/client-assertion"
  RATE_LIMITER_MAX_REQUESTS: "10"
  RATE_LIMITER_BURST_PERCENTAGE: "1.0"
  RATE_LIMITER_RATE_INTERVAL_MILLIS: "1000"
  RATE_LIMITER_TIMEOUT_MILLIS: "300"
  PRODUCER_KAFKA_CLIENT_ID: "{{.Values.namespace}}-pagopa-interop-authorization-process"
  CLIENT_ASSERTION_AUDIENCE: "auth.{{.Values.namespace}}.interop.pagopa.it/client-assertion"
  INTERACTION_TTL_EPSILON_SECONDS: "300"

deployment:
  image:
    repositoryName: "interop-be-authorization-server"
  env:
    HOST: "0.0.0.0"
    PORT: "8088"
    SERVICE_VERSION: "{{.Values.deployment.image.tag}}"
    KEEP_ALIVE_TIMEOUT_MILLIS: "61000"
    FEATURE_FLAG_CLIENT_ASSERTION_STRICT_CLAIMS_VALIDATION: "{{.Values.commons.featureFlags.featureFlagClientAssertionStrictClaimsValidation}}"
    FEATURE_FLAG_ASYNC_EXCHANGE: "{{.Values.commons.featureFlags.featureFlagAsyncExchange}}"
    PRODUCER_KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
    CONSUMER_TOKEN_AUDITING_TOPIC: "{{.Values.commons.kafka.consumerTokenAuditingTopic}}"
    API_TOKEN_AUDITING_TOPIC: "{{.Values.commons.kafka.apiTokenAuditingTopic}}"
    TOKEN_GENERATION_READMODEL_TABLE_NAME_TOKEN_GENERATION: "{{.Values.commons.tokenGenerationReadModel.tokenReadmodelTokenStatesTableName}}"
    TOKEN_GENERATION_READMODEL_TABLE_NAME_INTERACTIONS: "{{.Values.commons.tokenGenerationReadModel.tokenReadmodelInteractionsTableName}}"
    TOKEN_GENERATION_READMODEL_TABLE_NAME_PLATFORM: "{{.Values.commons.tokenGenerationReadModel.tokenReadmodelPlatformStatesTableName}}"
    PRODUCER_KEYCHAIN_PLATFORM_STATES_TABLE_NAME: "{{.Values.commons.tokenGenerationReadModel.producerKeychainPlatformStatesTableName}}"
    APPLICATION_AUDIT_TOPIC: "{{.Values.commons.kafka.applicationAuditTopic}}"
    APPLICATION_AUDIT_FALLBACK_SQS_URL: "{{.Values.commons.sqs.applicationAuditFallbackSqsUrl}}"
    RATE_LIMITER_REDIS_HOST: "{{.Values.commons.redis.redisHost}}"
    RATE_LIMITER_REDIS_PORT: "{{.Values.commons.redis.redisPort}}"
  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
    POD_NAME: "metadata.name"
    NODE_IP: "status.hostIP"
  envFromConfigmaps:
    FEATURE_FLAG_IMPROVED_PRODUCER_VERIFICATION_CLAIMS: "common-feature-flags.FEATURE_FLAG_IMPROVED_PRODUCER_VERIFICATION_CLAIMS"
  livenessProbe:
    httpGet:
      path: /authorization-server/status
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
  readinessProbe:
    httpGet:
      path: /authorization-server/status
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
  resources:
    limits:
      cpu: "500m"
      memory: "2Gi"
    requests:
      cpu: "500m"
      memory: "2Gi"
