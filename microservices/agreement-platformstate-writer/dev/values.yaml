name: "interop-be-agreement-platformstate-writer"
techStack: "nodejs"

serviceAccount:
  roleArn: "arn:aws:iam::505630707203:role/interop-be-agreement-platformstate-writer-dev-es1"

service:
  create: false

configmap:
  KAFKA_CLIENT_ID: "{{.Values.namespace}}-pagopa-interop-agreement-platformstate-writer"
  KAFKA_GROUP_ID: "{{.Values.namespace}}-agreement-platformstate-writer"

deployment:
  env:
    TOPIC_STARTING_OFFSET: "earliest"
    AGREEMENT_TOPIC: "{{.Values.commons.kafka.agreementTopic}}"
    TOKEN_GENERATION_READMODEL_TABLE_NAME_PLATFORM: "{{.Values.commons.tokenGenerationReadModel.tokenReadmodelPlatformStatesTableName}}"
    TOKEN_GENERATION_READMODEL_TABLE_NAME_TOKEN_GENERATION: "{{.Values.commons.tokenGenerationReadModel.tokenReadmodelTokenStatesTableName}}"
    KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
  
