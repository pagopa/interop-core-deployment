name: "interop-be-client-readmodel-writer"
techStack: "nodejs"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-client-readmodel-writer-{{.Values.namespace}}-es1"

service:
  create: false

configmap:
  KAFKA_CLIENT_ID: "{{.Values.namespace}}-pagopa-interop-client"
  KAFKA_GROUP_ID: "{{.Values.namespace}}-client-readmodel-writer"

externalSecrets:
  app:
    create: true
    data:
      - secretKey: READMODEL_DB_USERNAME
        remoteRef:
          key: app/backend/read-model
          property: PROJECTION_USR
          version: uuid/d64e70da-6e72-41d0-84b1-b2c705e02574
      - secretKey: READMODEL_DB_PASSWORD
        remoteRef:
          key: app/backend/read-model
          property: PROJECTION_PSW
          version: uuid/d64e70da-6e72-41d0-84b1-b2c705e02574

deployment:
  replicas: 0
  env:
    PORT: "8088"
    HOST: "0.0.0.0"
    TOPIC_STARTING_OFFSET: "earliest"
    AUTHORIZATION_TOPIC: "{{.Values.commons.kafka.authorizationTopic}}"
    KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
    READMODEL_DB_HOST: "{{.Values.commons.readModel.readmodelDbHost}}"
    READMODEL_DB_NAME: "{{.Values.commons.readModel.readmodelDbName}}"
    READMODEL_DB_PORT: "{{.Values.commons.readModel.readmodelDbPort}}"
  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
