name: interop-be-in-app-scheduled-notification-dispatcher

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-in-app-scheduled-notification-dispatcher-{{.Values.namespace}}-es1"

externalSecrets:
  flywayInitContainer:
    create: true
    data:
      - secretKey: FLYWAY_USER
        remoteRef:
          key: rds/interop-platform-data-dev/users/flyway_user
          property: username
          version: uuid/terraform-20250318135026647200000005
      - secretKey: FLYWAY_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/flyway_user
          property: password
          version: uuid/terraform-20250318135026647200000005
  app:
    create: true
    data:
      - secretKey: READMODEL_SQL_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_in_app_scheduled_notification_dispatcher_user
          property: username
          version: uuid/terraform-20260603154454143900000008
      - secretKey: READMODEL_SQL_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_in_app_scheduled_notification_dispatcher_user
          property: password
          version: uuid/terraform-20260603154454143900000008
      - secretKey: SCHEDULED_NOTIFICATION_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_in_app_scheduled_notification_dispatcher_user
          property: username
          version: uuid/terraform-20260603154454143900000008
      - secretKey: SCHEDULED_NOTIFICATION_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_in_app_scheduled_notification_dispatcher_user
          property: password
          version: uuid/terraform-20260603154454143900000008
      - secretKey: IN_APP_NOTIFICATION_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_in_app_notification_dispatcher_user
          property: username
          version: uuid/terraform-20250930101705379100000002
      - secretKey: IN_APP_NOTIFICATION_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_in_app_notification_dispatcher_user
          property: password
          version: uuid/terraform-20250930101705379100000002

cronjob:
  schedule: "30 7 * * 1-5"
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  restartPolicy: Never
  concurrencyPolicy: Forbid
  parallelism: 1
  activeDeadlineSeconds: 600
  backoffLimit: 0

  flywayInitContainer:
    create: true
    migrationsConfigmap: "flyway-scheduled-notification"
    env:
      FLYWAY_CREATE_SCHEMAS: true
      FLYWAY_PLACEHOLDER_REPLACEMENT: true
      FLYWAY_PLACEHOLDERS_NAMESPACE: "{{.Values.namespace}}"
      FLYWAY_URL: "jdbc:postgresql://{{.Values.commons.scheduledNotificationDb.dbHost}}:{{.Values.commons.scheduledNotificationDb.dbPort}}/{{.Values.commons.scheduledNotificationDb.dbName}}"
      FLYWAY_SCHEMAS: "{{.Values.namespace}}_scheduled_notification"
      POSTGRES_HOST: "{{.Values.commons.scheduledNotificationDb.dbHost}}"
      POSTGRES_PORT: "{{.Values.commons.scheduledNotificationDb.dbPort}}"
      POSTGRES_DB: "{{.Values.commons.scheduledNotificationDb.dbName}}"

  env:
    NOTIFICATION_TYPE_BLOCKLIST: ""
    DELIVERY_BATCH_SIZE: "100"
    MAX_ATTEMPTS: "5"
    MAX_BATCHES_PER_RUN: "10"
    SCHEDULED_NOTIFICATION_STALENESS_THRESHOLD_HOURS: "24"
    READMODEL_SQL_DB_HOST: "{{.Values.commons.readModelSql.dbHostRo}}"
    READMODEL_SQL_DB_PORT: "{{.Values.commons.readModelSql.dbPort}}"
    READMODEL_SQL_DB_NAME: "{{.Values.commons.readModelSql.dbName}}"
    READMODEL_SQL_DB_USE_SSL: "{{.Values.commons.readModelSql.dbUseSsl}}"
    READMODEL_SQL_DB_SCHEMA_AGREEMENT: "{{.Values.commons.readModelSql.dbSchemaAgreement}}"
    READMODEL_SQL_DB_SCHEMA_ATTRIBUTE: "{{.Values.commons.readModelSql.dbSchemaAttribute}}"
    READMODEL_SQL_DB_SCHEMA_CATALOG: "{{.Values.commons.readModelSql.dbSchemaCatalog}}"
    READMODEL_SQL_DB_SCHEMA_DELEGATION: "{{.Values.commons.readModelSql.dbSchemaDelegation}}"
    READMODEL_SQL_DB_SCHEMA_ESERVICE_TEMPLATE: "{{.Values.commons.readModelSql.dbSchemaEserviceTemplate}}"
    READMODEL_SQL_DB_SCHEMA_NOTIFICATION_CONFIG: "{{.Values.commons.readModelSql.dbSchemaNotificationConfig}}"
    READMODEL_SQL_DB_SCHEMA_PURPOSE: "{{.Values.commons.readModelSql.dbSchemaPurpose}}"
    READMODEL_SQL_DB_SCHEMA_TENANT: "{{.Values.commons.readModelSql.dbSchemaTenant}}"
    IN_APP_NOTIFICATION_DB_HOST: "{{.Values.commons.inAppNotificationDb.dbHost}}"
    IN_APP_NOTIFICATION_DB_PORT: "{{.Values.commons.inAppNotificationDb.dbPort}}"
    IN_APP_NOTIFICATION_DB_NAME: "{{.Values.commons.inAppNotificationDb.dbName}}"
    IN_APP_NOTIFICATION_DB_USE_SSL: "{{.Values.commons.inAppNotificationDb.dbUseSsl}}"
    IN_APP_NOTIFICATION_DB_SCHEMA: "{{.Values.commons.inAppNotificationDb.dbSchema}}"
    SCHEDULED_NOTIFICATION_DB_HOST: "{{.Values.commons.scheduledNotificationDb.dbHost}}"
    SCHEDULED_NOTIFICATION_DB_PORT: "{{.Values.commons.scheduledNotificationDb.dbPort}}"
    SCHEDULED_NOTIFICATION_DB_NAME: "{{.Values.commons.scheduledNotificationDb.dbName}}"
    SCHEDULED_NOTIFICATION_DB_USE_SSL: "{{.Values.commons.scheduledNotificationDb.dbUseSsl}}"
    SCHEDULED_NOTIFICATION_DB_SCHEMA: "{{.Values.commons.scheduledNotificationDb.dbSchema}}"

  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
