name: "interop-be-m2m-event-cleaner"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-m2m-event-cleaner-{{.Values.namespace}}-es1"

configmap:
  DELETE_OLDER_THAN_DAYS: "30"

externalSecrets:
  app:
    create: true
    data:
      - secretKey: M2M_EVENT_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_m2m_event_cleaner_user
          property: username
          version: uuid/terraform-20251201084353520600000002
      - secretKey: M2M_EVENT_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_m2m_event_cleaner_user
          property: password
          version: uuid/terraform-20251201084353520600000002

cronjob:
  schedule: "0 4 * * *"
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 0
  restartPolicy: OnFailure
  automountServiceAccountToken: false
  env:
    M2M_EVENT_DB_NAME: "{{.Values.commons.m2mEventsDb.dbName}}"
    M2M_EVENT_DB_HOST: "{{.Values.commons.m2mEventsDb.dbHostRw}}"
    M2M_EVENT_DB_PORT: "{{.Values.commons.m2mEventsDb.dbPort}}"
    M2M_EVENT_DB_USE_SSL: "{{.Values.commons.m2mEventsDb.dbUseSsl}}"
    M2M_EVENT_DB_SCHEMA: "{{.Values.commons.m2mEventsDb.dbSchema}}"
