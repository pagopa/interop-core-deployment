name: "interop-be-m2m-event-cleaner"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-m2m-event-cleaner-{{.Values.namespace}}-es1"

configmap:
  DELETE_OLDER_THAN_DAYS: "30"

externalSecrets:
  app:
    create: true
    data:
      - secretKey: M2M_EVENT_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_m2m_event_cleaner_user
          property: username
          version: terraform-20251201084353520600000002
      - secretKey: M2M_EVENT_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_m2m_event_cleaner_user
          property: password
          version: terraform-20251201084353520600000002

cronjob:
  schedule: "0 4 * * *"
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 0
  restartPolicy: OnFailure
  automountServiceAccountToken: false
  envFromConfigmaps:
    M2M_EVENT_DB_NAME: "common-m2m-events-db.DB_NAME"
    M2M_EVENT_DB_HOST: "common-m2m-events-db.DB_HOST_RW"
    M2M_EVENT_DB_PORT: "common-m2m-events-db.DB_PORT"
    M2M_EVENT_DB_USE_SSL: "common-m2m-events-db.DB_USE_SSL"
    M2M_EVENT_DB_SCHEMA: "common-m2m-events-db.DB_SCHEMA"
