name: "interop-be-one-trust-notices"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-one-trust-notices-{{.Values.namespace}}-es1"

configmap:
  LANGS: "it"
  CONTENT_STORAGE_BUCKET: "interop-privacy-notices-content-qa-es1"
  HISTORY_STORAGE_BUCKET: "interop-privacy-notices-history-qa-es1"
  PRIVACY_NOTICES_UPDATER_PRIVACY_POLICY_UUID: "0df21ff6-3e8f-4320-af8f-23dea9135d57"
  PRIVACY_NOTICES_UPDATER_TERMS_OF_SERVICE_UUID: "6bf8412a-41a7-41a0-82dc-26286ce61b1a"

externalSecrets:
  app:
    create: true
    data:
      - secretKey: ONETRUST_CLIENT_ID
        remoteRef:
          key: app/backend/onetrust
          property: ONETRUST_CLIENT_ID
          version: uuid/88cb7e82-30e7-4222-9829-0c05885bd2ff
      - secretKey: ONETRUST_CLIENT_SECRET
        remoteRef:
          key: app/backend/onetrust
          property: ONETRUST_CLIENT_SECRET
          version: uuid/88cb7e82-30e7-4222-9829-0c05885bd2ff

cronjob:
  schedule: "0 */3 * * *"
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 0
  restartPolicy: OnFailure
  env:
    TERMS_OF_SERVICE_NOTICE_ID: ""
    PRIVACY_POLICY_NOTICE_ID: ""
    PRIVACY_NOTICES_DYNAMO_TABLE_NAME: "interop-privacy-notices-qa"
