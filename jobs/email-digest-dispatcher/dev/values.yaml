name: interop-be-email-digest-dispatcher

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-email-digest-dispatcher-{{.Values.namespace}}-es1"

configmap:
  KAFKA_GROUP_ID: "{{.Values.namespace}}-email-digest-dispatcher"
  TOPIC_STARTING_OFFSET: "latest"
  PRODUCER_KAFKA_TRANSACTIONAL_ID: "{{.Values.namespace}}-email-digest-dispatcher-transactional-id"

externalSecrets:
  flywayInitContainer:
    create: true
    data:
      - secretKey: FLYWAY_USER
        remoteRef:
          key: rds/interop-platform-data-dev/users/flyway_user
          property: username
          version: uuid/terraform-20250318135026647200000005
      - secretKey: FLYWAY_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/flyway_user
          property: password
          version: uuid/terraform-20250318135026647200000005
  app:
    create: true
    data:
      - secretKey: DIGEST_TRACKING_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_email_digest_dispatcher_user
          property: username
          version: uuid/terraform-20260212133048976200000002
      - secretKey: DIGEST_TRACKING_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_email_digest_dispatcher_user
          property: password
          version: uuid/terraform-20260212133048976200000002
      - secretKey: READMODEL_SQL_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_email_digest_dispatcher_user
          property: username
          version: uuid/terraform-20260212133048976200000002
      - secretKey: READMODEL_SQL_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_email_digest_dispatcher_user
          property: password
          version: uuid/terraform-20260212133048976200000002

cronjob:
  schedule: "0 3 * * *"
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  restartPolicy: OnFailure

  flywayInitContainer:
    create: true
    migrationsConfigmap: "flyway-digest-tracking"
    env:
      FLYWAY_CREATE_SCHEMAS: true
      FLYWAY_PLACEHOLDER_REPLACEMENT: true
      FLYWAY_PLACEHOLDERS_NAMESPACE: "{{.Values.namespace}}"
      FLYWAY_URL: jdbc:postgresql://$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
      FLYWAY_SCHEMAS: "{{.Values.namespace}}_digest_tracking"
    envFromConfigmaps:
      POSTGRES_HOST: "common-digest-tracking-db.DB_HOST_RW"
      POSTGRES_PORT: "common-digest-tracking-db.DB_PORT"
      POSTGRES_DB: "common-digest-tracking-db.DB_NAME"

  env:
    BFF_URL: "https://selfcare.dev.interop.pagopa.it/0.0/backend-for-frontend"
    DIGEST_FREQUENCY_HOURS: "1"
    PRIORITY_PRODUCER_IDS: "e79a24cd-8edc-441e-ae8d-e87c3aea0059,69e2865e-65ab-4e48-a638-2037a9ee2ee7" # Comune di Milano, PagoPa
    EMAIL_DISPATCH_TOPIC: "{{.Values.commons.kafka.emailDispatchTopic}}"
    PRODUCER_KAFKA_BROKERS: "{{.Values.commons.kafka.kafkaBrokers}}"
    READMODEL_SQL_DB_HOST: "{{.Values.commons.readModelSql.dbHostRo}}"
    READMODEL_SQL_DB_PORT: "{{.Values.commons.readModelSql.dbPort}}"
    READMODEL_SQL_DB_NAME: "{{.Values.commons.readModelSql.dbName}}"
    READMODEL_SQL_DB_USE_SSL: "{{.Values.commons.readModelSql.dbUseSsl}}"
    READMODEL_SQL_DB_SCHEMA_AGREEMENT: "{{.Values.commons.readModelSql.dbSchemaAgreement}}"
    READMODEL_SQL_DB_SCHEMA_ATTRIBUTE: "{{.Values.commons.readModelSql.dbSchemaAttribute}}"
    READMODEL_SQL_DB_SCHEMA_CATALOG: "{{.Values.commons.readModelSql.dbSchemaCatalog}}"
    READMODEL_SQL_DB_SCHEMA_DELEGATION: "{{.Values.commons.readModelSql.dbSchemaDelegation}}"
    READMODEL_SQL_DB_SCHEMA_ESERVICE_TEMPLATE: "{{.Values.commons.readModelSql.dbSchemaEserviceTemplate}}"
    READMODEL_SQL_DB_SCHEMA_NOTIFICATION_CONFIG: "{{.Values.commons.readModelSql.dbSchemaNotificationConfig}}"
    READMODEL_SQL_DB_SCHEMA_PURPOSE: "{{.Values.commons.readModelSql.dbSchemaPurpose}}"
    READMODEL_SQL_DB_SCHEMA_TENANT: "{{.Values.commons.readModelSql.dbSchemaTenant}}"
  envFromConfigmaps:
    DIGEST_TRACKING_DB_HOST: "common-digest-tracking-db.DB_HOST_RW"
    DIGEST_TRACKING_DB_PORT: "common-digest-tracking-db.DB_PORT"
    DIGEST_TRACKING_DB_NAME: "common-digest-tracking-db.DB_NAME"
    DIGEST_TRACKING_DB_USE_SSL: "common-digest-tracking-db.DB_USE_SSL"
    DIGEST_TRACKING_DB_SCHEMA: "common-digest-tracking-db.DB_SCHEMA"
  envFromFieldRef:
    AWS_ROLE_SESSION_NAME: "metadata.name"
    PRODUCER_KAFKA_CLIENT_ID: "metadata.name"
