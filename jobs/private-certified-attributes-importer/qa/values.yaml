name: "interop-be-private-certified-attributes-importer"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-private-certified-attributes-importer-{{.Values.namespace}}-es1"

configmap:
  INTERNAL_JWT_KID: "{{.Values.local.interop_be_commons.INTERNAL_KEY_IDENTIFIER}}"
  INTERNAL_JWT_SUBJECT: "{{.Values.namespace}}.interop-m2m"
  INTERNAL_JWT_ISSUER: "{{.Values.namespace}}.interop.pagopa.it"
  INTERNAL_JWT_AUDIENCE: "{{.Values.namespace}}.interop.pagopa.it/internal"
  INTERNAL_JWT_SECONDS_DURATION: "1800"
  ATTRIBUTE_CREATION_WAIT_TIME: "10"

externalSecrets:
  app:
    create: true
    data:
      - secretKey: READMODEL_DB_USERNAME
        remoteRef:
          key: app/backend/read-model
          property: READONLY_USR
          version: uuid/8ad69b0a-b7e4-421c-9421-d818c95b1c9b
      - secretKey: READMODEL_DB_PASSWORD
        remoteRef:
          key: app/backend/read-model
          property: READONLY_PSW
          version: uuid/8ad69b0a-b7e4-421c-9421-d818c95b1c9b
      - secretKey: READMODEL_SQL_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-qa/users/qa_private_certified_attributes_importer_user
          property: username
          version: uuid/terraform-20260408071924021000000003
      - secretKey: READMODEL_SQL_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-qa/users/qa_private_certified_attributes_importer_user
          property: password
          version: uuid/terraform-20260408071924021000000003

cronjob:
  schedule: "30 7 * * *"
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 0
  restartPolicy: OnFailure
  automountServiceAccountToken: false
  suspend: true
  envFromConfigmaps:
    READMODEL_DB_HOST: "common-read-model.READMODEL_DB_HOST"
    READMODEL_DB_PORT: "common-read-model.READMODEL_DB_PORT"
    READMODEL_DB_NAME: "common-read-model.READMODEL_DB_NAME"
    TENANT_PROCESS_URL: "common-services-urls.TENANT_PROCESS_URL"
    ATTRIBUTE_PROCESS_URL: "common-services-urls.ATTRIBUTE_REGISTRY_PROCESS_URL"
    READMODEL_SQL_DB_HOST: "common-read-model-sql.DB_HOST_RO"
    READMODEL_SQL_DB_PORT: "common-read-model-sql.DB_PORT"
    READMODEL_SQL_DB_NAME: "common-read-model-sql.DB_NAME"
    READMODEL_SQL_DB_USE_SSL: "common-read-model-sql.DB_USE_SSL"
    READMODEL_SQL_DB_SCHEMA_ATTRIBUTE: "common-read-model-sql.DB_SCHEMA_ATTRIBUTE"
    READMODEL_SQL_DB_SCHEMA_TENANT: "common-read-model-sql.DB_SCHEMA_TENANT"
