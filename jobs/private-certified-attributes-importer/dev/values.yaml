name: "interop-be-private-certified-attributes-importer"

serviceAccount:
  roleArn: "arn:aws:iam::{{.Values.local.awsAccountId}}:role/interop-be-private-certified-attributes-importer-{{.Values.namespace}}-es1"

configmap:
  INTERNAL_JWT_KID: "{{.Values.local.interop_be_commons.INTERNAL_KEY_IDENTIFIER}}"
  INTERNAL_JWT_SUBJECT: "{{.Values.namespace}}.interop-m2m"
  INTERNAL_JWT_ISSUER: "{{.Values.namespace}}.interop.pagopa.it"
  INTERNAL_JWT_AUDIENCE: "{{.Values.namespace}}.interop.pagopa.it/internal"
  INTERNAL_JWT_SECONDS_DURATION: "1800"
  ATTRIBUTE_CREATION_WAIT_TIME: "10"

externalSecrets:
  app:
    create: true
    data:
      - secretKey: READMODEL_DB_USERNAME
        remoteRef:
          key: app/backend/read-model
          property: READONLY_USR
          version: uuid/d64e70da-6e72-41d0-84b1-b2c705e02574
      - secretKey: READMODEL_DB_PASSWORD
        remoteRef:
          key: app/backend/read-model
          property: READONLY_PSW
          version: uuid/d64e70da-6e72-41d0-84b1-b2c705e02574
      - secretKey: READMODEL_SQL_DB_USERNAME
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_private_certified_attributes_importer_user
          property: username
          version: uuid/terraform-20260407073650787100000002
      - secretKey: READMODEL_SQL_DB_PASSWORD
        remoteRef:
          key: rds/interop-platform-data-dev/users/dev_private_certified_attributes_importer_user
          property: password
          version: uuid/terraform-20260407073650787100000002

cronjob:
  schedule: "30 7 * * *"
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 0
  restartPolicy: OnFailure
  automountServiceAccountToken: false
  suspend: true
  env:
    READMODEL_DB_HOST: "{{.Values.commons.readModel.readmodelDbHost}}"
    READMODEL_DB_PORT: "{{.Values.commons.readModel.readmodelDbPort}}"
    READMODEL_DB_NAME: "{{.Values.commons.readModel.readmodelDbName}}"
    TENANT_PROCESS_URL: "{{.Values.commons.servicesUrls.tenantProcessUrl}}"
    ATTRIBUTE_PROCESS_URL: "{{.Values.commons.servicesUrls.attributeRegistryProcessUrl}}"
    READMODEL_SQL_DB_HOST: "{{.Values.commons.readModelSql.dbHostRo}}"
    READMODEL_SQL_DB_PORT: "{{.Values.commons.readModelSql.dbPort}}"
    READMODEL_SQL_DB_NAME: "{{.Values.commons.readModelSql.dbName}}"
    READMODEL_SQL_DB_USE_SSL: "{{.Values.commons.readModelSql.dbUseSsl}}"
    READMODEL_SQL_DB_SCHEMA_ATTRIBUTE: "{{.Values.commons.readModelSql.dbSchemaAttribute}}"
    READMODEL_SQL_DB_SCHEMA_TENANT: "{{.Values.commons.readModelSql.dbSchemaTenant}}"
