namespace: vapt

service:
  targetPort: http
  portName: http

deployment:
  replicas: 1
  enableRolloutAnnotations: true
  strategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxUnavailable: 0%
      maxSurge: 50%
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  image:
    repositoryPrefix: "505630707203.dkr.ecr.eu-south-1.amazonaws.com"
    imagePullPolicy: Always
    tag: $IMAGE_TAG_PLACEHOLDER
    digest: $IMAGE_DIGEST_PLACEHOLDER
  env:
    LOG_LEVEL: "info"
    NODE_ENV: "production"

local:
  interop_be_commons:
    DEV_ENDPOINTS_ENABLED: "false"
    AUTHSRV_KEY_IDENTIFIER: "65ce3bd3-88ed-40c1-9787-0a55e7f35332"
    INTERNAL_KEY_IDENTIFIER: "cbf0fdeb-4c56-40f6-bc6e-6b42a1274255"
    BFF_KEY_IDENTIFIER: "9f63f3e4-ea2b-4510-820a-6879310cd27c"
    INTEGRITY_REST_KEY_IDENTIFIER: "e2eb4b24-c2d3-4c4e-b2b1-4e32300d0012"
    ENABLED_PROJECTIONS: "false"
  well_known_url:
    AUTHSRV: "https://vapt.interop.pagopa.it/.well-known/jwks.json"
    SELFCARE: "https://uat.selfcare.pagopa.it/.well-known/jwks.json"
    BFF: "https://interop-private-well-known-vapt.s3.eu-south-1.amazonaws.com/.well-known/bff-jwks.json"
    INTERNAL: "https://interop-private-well-known-vapt.s3.eu-south-1.amazonaws.com/.well-known/internal-jwks.json"
    MAINTENANCE: "https://interop-private-well-known-vapt.s3.eu-south-1.amazonaws.com/.well-known/maintenance-jwks.json"
  awsAccountId: "565393043798"
  env: "vapt"

autoscaling:
  keda:
    create: true
    # this config is mainly used by the data preparation pipeline to scale down/up when required
    minReplicaCount: "{{.Values.deployment.replicas}}"
    maxReplicaCount: "{{.Values.deployment.replicas}}"
    triggers:
      - type: cpu
        metricType: Utilization
        metadata:
          value: "50"
