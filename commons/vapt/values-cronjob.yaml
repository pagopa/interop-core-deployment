namespace: "vapt"

cronjob:
  suspend: true
  image:
    repositoryPrefix: "505630707203.dkr.ecr.eu-south-1.amazonaws.com"
    imagePullPolicy: Always
    tag: $IMAGE_TAG_PLACEHOLDER
    digest: $IMAGE_DIGEST_PLACEHOLDER
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  env:
    LOG_LEVEL: "info"
    NODE_ENV: "production"

local:
  interop_be_commons:
    INTERNAL_KEY_IDENTIFIER: "cbf0fdeb-4c56-40f6-bc6e-6b42a1274255"
  awsAccountId: "565393043798"
  env: "vapt"
