namespace: "dev"

cronjob:
  image:
    repositoryPrefix: "505630707203.dkr.ecr.eu-south-1.amazonaws.com"
    imagePullPolicy: Always
    tag: $IMAGE_TAG_PLACEHOLDER
    digest: $IMAGE_DIGEST_PLACEHOLDER
  env:
    LOG_LEVEL: "info"
    NODE_ENV: "production"
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

local:
  interop_be_commons:
    INTERNAL_KEY_IDENTIFIER: "3039d3b6-9efb-4591-b327-25130b6347ab"
  awsAccountId: "505630707203"
  env: "dev"

argocd:
  appMonitoring:
    enable: true
    projectRepositoryURL: "https://github.com/pagopa/interop-core-deployment"
    projectRepositoryRef: "main"
    jobNamespace: "argocd-app-monitoring"
    serviceAccountName: "argocd-terraform-workload-monitoring"
    tfEnv: "{{ .Values.local.env }}"
    tfStateBucketKeyPrefix: "{{ .Values.local.env }}-es1"