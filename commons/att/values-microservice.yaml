namespace: att

service:
  targetPort: http
  portName: http

deployment:
  enableRolloutAnnotations: true
  replicas: 1
  strategy:
    type: "RollingUpdate"
    rollingUpdate:
      maxUnavailable: 0%
      maxSurge: 50%
  image:
    repositoryPrefix: "505630707203.dkr.ecr.eu-south-1.amazonaws.com"
    imagePullPolicy: Always
    tag: $IMAGE_TAG_PLACEHOLDER
    digest: $IMAGE_DIGEST_PLACEHOLDER
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"
  env:
    LOG_LEVEL: "info"
    NODE_ENV: "production"

local:
  interop_be_commons:
    RSA_KEYS_IDENTIFIERS: "490baa58-8d24-4adf-bfb3-f19a9e505b9a"
    DEV_ENDPOINTS_ENABLED: "false"
    ENABLED_PROJECTIONS: "false"
  well_known_url:
    AUTHSRV: "https://att.interop.pagopa.it/.well-known/jwks.json"
    SELFCARE: "https://selfcare.pagopa.it/.well-known/jwks.json"
    BFF: "https://interop-private-well-known-att.s3.eu-south-1.amazonaws.com/.well-known/bff-jwks.json"
    INTERNAL: "https://interop-private-well-known-att.s3.eu-south-1.amazonaws.com/.well-known/internal-jwks.json"
    MAINTENANCE: "https://interop-private-well-known-att.s3.eu-south-1.amazonaws.com/.well-known/maintenance-jwks.json"
  awsAccountId: "533267098416"
  env: "att"
