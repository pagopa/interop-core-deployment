namespace: test

service:
  targetPort: http
  portName: http

deployment:
  enableRolloutAnnotations: true
  replicas: 1
  image:
    repositoryPrefix: "505630707203.dkr.ecr.eu-south-1.amazonaws.com"
    imagePullPolicy: Always
    tag: $IMAGE_TAG_PLACEHOLDER
    digest: $IMAGE_DIGEST_PLACEHOLDER
  env:
    LOG_LEVEL: "info"
    NODE_ENV: "production"
  resources:
    requests:
      cpu: "1000m"
      memory: "2Gi"
    limits:
      cpu: "1000m"
      memory: "2Gi"

local:
  interop_be_commons:
    RSA_KEYS_IDENTIFIERS: "cdb52532-dd94-40ef-824d-9c55b10e6bc9"
    DEV_ENDPOINTS_ENABLED: "false"
    ENABLED_PROJECTIONS: "false"
  well_known_url:
    AUTHSRV: "https://uat.interop.pagopa.it/.well-known/jwks.json"
    SELFCARE: "https://selfcare.pagopa.it/.well-known/jwks.json"
    BFF: "https://interop-private-well-known-test.s3.eu-south-1.amazonaws.com/.well-known/bff-jwks.json"
    INTERNAL: "https://interop-private-well-known-test.s3.eu-south-1.amazonaws.com/.well-known/internal-jwks.json"
    MAINTENANCE: "https://interop-private-well-known-test.s3.eu-south-1.amazonaws.com/.well-known/maintenance-jwks.json"
  awsAccountId: "895646477129"
  env: "test"
