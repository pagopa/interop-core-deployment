  template:
    metadata:
      name: "{{index .ms.path.segments 2}}-dev-argocd-deploy"
      namespace: argocd
    spec:
      project: "interop-core-dev"
      sources:
        - repoURL: git@github.com:pagopa/interop-core-deployment.git
          path: "."
          targetRevision: PIN-11112_testing-deploy-via-argocd
          ref: values
        - repoURL: https://pagopa.github.io/interop-eks-microservice-chart
          chart: interop-eks-microservice-chart
          targetRevision: 1.48.0
          helm:
            releaseName: "{{index .ms.path.segments 2}}"
            valueFiles:
              #- $values/commons/dev/values-commons.yaml
              - $values/commons/dev-argocd-deploy/values-microservice.yaml
              - $values/microservices/{{index .ms.path.segments 2}}/dev-argocd-deploy/values.yaml
              #- $values/commons/dev/migrations/flyway*.yaml
              - $values/commons/dev-argocd-deploy/images.yaml
            ignoreMissingValueFiles: true
            values: |
              {{- $images := .images | default dict -}}
              {{- $msmap := (index $images "microservices") | default dict -}}
              {{- $ms := (index $msmap (index .ms.path.segments 2)) | default dict -}}
              deployment:
                image:
                  tag: {{ get $ms "tag" | default "" }}
                  digest: {{ get $ms "digest" | default "" }}
      destination:
        server: https://kubernetes.default.svc
        namespace: "dev-argocd-deploy"
      ignoreDifferences:
        - group: ""
          kind: Secret
          jsonPointers:
            - /data
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=false
          - RespectIgnoreDifferences=true