apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: interop-root-appofapps-dev-argocd-deploy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
    argocd.argoproj.io/tracking-id: interop-root-appofapps-dev-argocd-deploy:argoproj.io/Application:argocd/interop-root-appofapps-dev-argocd-deploy
spec:
  project: default
  source:
    repoURL: https://github.com/pagopa/interop-core-deployment.git
    # repoURL: git@github.com:pagopa/interop-core-deployment.git
    targetRevision: PIN-11112_testing-deploy-via-argocd
    path: argocd/dev-argocd-deploy
    directory:
      include: "{*.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true # Automatically override manual edits to the cluster resources by syncing the application when it drifts from the desired state
      prune: true # Automatically delete resources from the cluster that are no longer defined in the desired state
    syncOptions:
      - CreateNamespace=false