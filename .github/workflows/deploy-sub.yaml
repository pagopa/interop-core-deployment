name: Deploy (sub)

on: 
  workflow_call:
    inputs:
      environment:
        description: 'Environment to run apply against'
        required: true
        type: string
      timeout_seconds:
        description: 'Kubectl apply wait timeout in seconds for Deployments'
        required: true
        type: number
      force_restart:
        description: 'Force Deployment Rollout Restart'
        required: true
        default: false
        type: boolean
  
defaults:
  run:
    shell: bash

env:
  SCRIPTS_FOLDER: "./interop-infra-commons/scripts/helm"

jobs:  
  workflow_setup:
    name: Setup steps
    runs-on: [ self-hosted, "run_id:${{ inputs.environment }}-${{ github.run_id }}" ]
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment }}
    outputs:
      microservices: ${{ steps.set-outputs.outputs.microservices }}
      cronjobs: ${{ steps.set-outputs.outputs.cronjobs }}
      deploy_mode: ${{ steps.set-outputs.outputs.deploy_mode }}
      cronjob_deploy_mode: ${{ steps.set-outputs.outputs.cronjob_deploy_mode }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
      - id: set-outputs
        run: |
          set -euo pipefail

          echo "microservices=$(find microservices -type f -path "*/$TARGET_ENVIRONMENT/values.yaml" -exec dirname {} \; | awk -F'/' '{print $2}' | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"
          echo "cronjobs=$(find jobs -type f -path "*/$TARGET_ENVIRONMENT/values.yaml" -exec dirname {} \; | awk -F'/' '{print $2}' | jq -R -s -c 'split("\n")[:-1]')" >> "$GITHUB_OUTPUT"

          COMMON_VALUES_FILE="commons/$TARGET_ENVIRONMENT/values-microservice.yaml"
          DEPLOY_MODE=$(yq -r '.deployMode // "HELM_UPGRADE"' "$COMMON_VALUES_FILE")

          case "$DEPLOY_MODE" in
            HELM_UPGRADE|KUBECTL_APPLY)
              ;;
            *)
              echo "::error file=$COMMON_VALUES_FILE::Unsupported deployMode '$DEPLOY_MODE'. Allowed values: HELM_UPGRADE, KUBECTL_APPLY."
              exit 1
              ;;
          esac

          echo "deploy_mode=$DEPLOY_MODE" >> "$GITHUB_OUTPUT"
          echo "INFO - Selected microservices deploy mode for '$TARGET_ENVIRONMENT': $DEPLOY_MODE"

          CRONJOB_COMMON_VALUES_FILE="commons/$TARGET_ENVIRONMENT/values-cronjob.yaml"
          CRONJOB_DEPLOY_MODE=$(yq -r '.deployMode // "HELM_UPGRADE"' "$CRONJOB_COMMON_VALUES_FILE")

          case "$CRONJOB_DEPLOY_MODE" in
            HELM_UPGRADE|KUBECTL_APPLY)
              ;;
            *)
              echo "::error file=$CRONJOB_COMMON_VALUES_FILE::Unsupported deployMode '$CRONJOB_DEPLOY_MODE'. Allowed values: HELM_UPGRADE, KUBECTL_APPLY."
              exit 1
              ;;
          esac

          echo "cronjob_deploy_mode=$CRONJOB_DEPLOY_MODE" >> "$GITHUB_OUTPUT"
          echo "INFO - Selected cronjobs deploy mode for '$TARGET_ENVIRONMENT': $CRONJOB_DEPLOY_MODE"
  

  deploy_common_configmaps:
    name: Deploy Common Configmaps
    needs: [ workflow_setup ]
    runs-on: [ self-hosted, "run_id:${{ inputs.environment }}-${{ github.run_id }}" ]
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
      - name: Update Kubeconfig
        id: update_kubeconfig
        run: |
          set -euo pipefail

          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}
      - name: Apply commons configmaps
        id: apply_commons_configmap
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          
          commons_configmaps_path="commons/$ENVIRONMENT/configmaps"
          
          if [[ -n "$(ls -A $commons_configmaps_path)" ]]; then
            for f in $commons_configmaps_path/*; do
              kubectl apply -f $f
            done;
          fi

  deploy_ms:
    name: ${{ matrix.microservice }}
    runs-on: [ self-hosted, "run_id:${{ inputs.environment }}-${{ github.run_id }}" ]
    environment: ${{ inputs.environment }}
    needs: [workflow_setup, deploy_common_configmaps]
    if: ${{ ! contains(needs.workflow_setup.outputs.microservices, '[]') }}
    strategy:
      matrix:
        microservice: ${{ fromJson(needs.workflow_setup.outputs.microservices) }}
      fail-fast: false
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
      - name: Checkout scripts repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          repository: pagopa/interop-infra-commons
          path: interop-infra-commons 
          fetch-depth: 0
          sparse-checkout: 'scripts/helm'
          ref: ${{ vars.INFRA_COMMONS_TAG }}
      - name: Set kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}
      - name: Microservice Helm Template
        id: microservice_helm_template
        env:
          MICROSERVICE_NAME: ${{ matrix.microservice }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          
          export PROJECT_DIR=$(pwd)
          $SCRIPTS_FOLDER/helmTemplate-svc-single.sh --debug --environment "$ENVIRONMENT" --microservice "$MICROSERVICE_NAME" -i "$PROJECT_DIR/commons/$ENVIRONMENT/images.yaml" --output console
      - name: Diff
        id: diff
        env:
          MICROSERVICE_NAME: ${{ matrix.microservice }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          export PROJECT_DIR=$(pwd)

          set +e
          $SCRIPTS_FOLDER/helmDiff-svc-single-standalone.sh --skip-dep --environment "$ENVIRONMENT" --microservice $MICROSERVICE_NAME -i $PROJECT_DIR/commons/"$ENVIRONMENT"/images.yaml
          DIFF_EXIT_CODE=$?
          set -e
          
          if [[ $DIFF_EXIT_CODE == 0 ]]; then
            echo "Diff Output: No diff has been found for ${MICROSERVICE_NAME}"
          elif [[ $DIFF_EXIT_CODE == 1 || $DIFF_EXIT_CODE == 2 ]]; then
            echo "Diff Output: Diff has been found for ${MICROSERVICE_NAME}"
          else
            echo "::error title=Diff Error::Error occurred during diff, exit code $DIFF_EXIT_CODE"
            exit $DIFF_EXIT_CODE
          fi
      - name: Deploy
        env:
          MICROSERVICE_NAME: ${{ matrix.microservice }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          FORCE_ROLLOUT: ${{ inputs.force_restart }}
          ENABLE_FORCE_UPGRADE: ${{ vars.HELM_FORCE_UPGRADE_MICROSERVICES_CSV == '*' || contains(vars.HELM_FORCE_UPGRADE_MICROSERVICES_CSV, matrix.microservice) }}
          ENVIRONMENT: ${{ inputs.environment }}
          HELM_FORCE_UPGRADE_MICROSERVICES_CSV: ${{ vars.HELM_FORCE_UPGRADE_MICROSERVICES_CSV }}
          DEPLOY_MODE: ${{ needs.workflow_setup.outputs.deploy_mode }}
        run: |
          set -euo pipefail
          
          echo "matrix.microservice: $MICROSERVICE_NAME"
          echo "vars.HELM_FORCE_UPGRADE_MICROSERVICES_CSV: $HELM_FORCE_UPGRADE_MICROSERVICES_CSV"
          echo "ENABLE_FORCE_UPGRADE: $ENABLE_FORCE_UPGRADE"
          echo "INFO - Deploy mode: $DEPLOY_MODE"

          TIMEOUT="${TIMEOUT_SECONDS}s"

          export PROJECT_DIR=$(pwd)
          $SCRIPTS_FOLDER/helmTemplate-svc-single.sh --debug -e "$ENVIRONMENT" -m $MICROSERVICE_NAME -i $PROJECT_DIR/commons/"$ENVIRONMENT"/images.yaml --output "$(pwd)/template.yaml"

          if [[ ! -s "$PROJECT_DIR/template.yaml" ]]; then
            echo "::error::Rendered manifest '$PROJECT_DIR/template.yaml' is missing or empty."
            exit 1
          fi

          K8S_NAMESPACE=$(cat "$PROJECT_DIR/template.yaml" | yq 'select(.kind == "Deployment") | .metadata.namespace')
          MICROSERVICE_FULLNAME=$(cat "$PROJECT_DIR/template.yaml" | yq 'select(.kind == "Deployment") | .metadata.name')

          if [[ -z "$K8S_NAMESPACE" || -z "$MICROSERVICE_FULLNAME" ]]; then
            echo "::error::Unable to resolve Deployment name or namespace from '$PROJECT_DIR/template.yaml'."
            exit 1
          fi
          
          echo "INFO - Apply changes for $MICROSERVICE_FULLNAME."

          case "$DEPLOY_MODE" in
            HELM_UPGRADE)
              HELM_UPGRADE_OPTIONS="--debug --skip-dep --output console"
              if [[ "$ENABLE_FORCE_UPGRADE" == "true" ]]; then
                echo "INFO - Force upgrade requested for $MICROSERVICE_FULLNAME"
                HELM_UPGRADE_OPTIONS=$HELM_UPGRADE_OPTIONS" --force"
              fi

              echo "INFO - Deploying $MICROSERVICE_FULLNAME with Helm upgrade."
              "$SCRIPTS_FOLDER/helmUpgrade-svc-single-standalone.sh" $HELM_UPGRADE_OPTIONS --environment "$K8S_NAMESPACE" -m "$MICROSERVICE_NAME" -i "$PROJECT_DIR/commons/$K8S_NAMESPACE/images.yaml"
              ;;
            KUBECTL_APPLY)
              if [[ "$ENABLE_FORCE_UPGRADE" == "true" ]]; then
                echo "::notice::HELM_FORCE_UPGRADE_MICROSERVICES_CSV is ignored in KUBECTL_APPLY mode for $MICROSERVICE_FULLNAME."
              fi

              echo "INFO - Deploying $MICROSERVICE_FULLNAME by applying the rendered Helm manifest."
              kubectl apply --namespace "$K8S_NAMESPACE" --filename "$PROJECT_DIR/template.yaml"
              ;;
            *)
              echo "::error::Unsupported deploy mode '$DEPLOY_MODE'."
              exit 1
              ;;
          esac

          DESIRED_REPLICAS=$(kubectl get deployment "$MICROSERVICE_FULLNAME" -n "$K8S_NAMESPACE" -o jsonpath='{.spec.replicas}')
          echo "INFO - Desired replicas: $DESIRED_REPLICAS"
          if [ "$DESIRED_REPLICAS" -eq 0 ]; then
            echo "::info::INFO - Desired replicas for $MICROSERVICE_FULLNAME are 0. Stopping further operations."
            exit 0
          fi

          # Check if the force rollout flag is true
          if [ "$FORCE_ROLLOUT" = true ]; then
            echo "::info::INFO - Force rollout restart requested $MICROSERVICE_FULLNAME."
            if ! kubectl rollout status -n "$K8S_NAMESPACE" "deployment/$MICROSERVICE_FULLNAME" --watch=false >/dev/null 2>&1; then
              echo "::info::INFO - Rollout already active for $MICROSERVICE_FULLNAME. No force restart needed."
            else
              echo "INFO - No rollout in progress, forcing a rollout restart."
              kubectl rollout restart -n "$K8S_NAMESPACE" "deployment/$MICROSERVICE_FULLNAME"
            fi
          fi

          echo "INFO - Wait for the rollout of the $MICROSERVICE_FULLNAME to finish (Max $TIMEOUT)."
          if ! kubectl rollout status -n "$K8S_NAMESPACE" "deployment/$MICROSERVICE_FULLNAME" --timeout="$TIMEOUT" --watch >/dev/null 2>&1; then
            echo "::error::ERROR - Rollout for $MICROSERVICE_FULLNAME failed or exceeded $TIMEOUT."
            exit 1
          fi

          echo "INFO - Rollout for $MICROSERVICE_FULLNAME completed successfully."

  deploy_cj:
    name: ${{ matrix.cronjob }}
    runs-on: [ self-hosted, "run_id:${{ inputs.environment }}-${{ github.run_id }}" ]
    environment: ${{ inputs.environment }}
    needs: [workflow_setup, deploy_common_configmaps]
    if: ${{ ! contains(needs.workflow_setup.outputs.cronjobs, '[]') }}
    strategy:
      matrix:
        cronjob: ${{ fromJson(needs.workflow_setup.outputs.cronjobs) }}
      fail-fast: false
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
      - name: Checkout scripts repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29
        with:
          repository: pagopa/interop-infra-commons
          path: interop-infra-commons 
          fetch-depth: 0
          sparse-checkout: 'scripts/helm'
          ref: ${{ vars.INFRA_COMMONS_TAG }}
      - name: Set kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name ${{ secrets.EKS_CLUSTER_NAME }}
      - name: Cronjob Helm Template
        id: cronjob_helm_template
        env:
          CRONJOB_NAME: ${{ matrix.cronjob }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          
          export PROJECT_DIR=$(pwd)
          $SCRIPTS_FOLDER/helmTemplate-cron-single.sh --debug --environment "$ENVIRONMENT" --job $CRONJOB_NAME -i $PROJECT_DIR/commons/"$ENVIRONMENT"/images.yaml --output console
      - name: Diff
        id: diff
        env:
          CRONJOB_NAME: ${{ matrix.cronjob }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          export PROJECT_DIR=$(pwd)

          set +e
          $SCRIPTS_FOLDER/helmDiff-cron-single-standalone.sh --skip-dep --environment "$ENVIRONMENT" --job $CRONJOB_NAME -i $PROJECT_DIR/commons/"$ENVIRONMENT"/images.yaml
          
          DIFF_EXIT_CODE=$?
          set -e
          
          if [[ $DIFF_EXIT_CODE == 0 ]]; then
            echo "Diff Output: No diff has been found for ${CRONJOB_NAME}"
          elif [[ $DIFF_EXIT_CODE == 1 || $DIFF_EXIT_CODE == 2 ]]; then
            echo "Diff Output: Diff has been found for ${CRONJOB_NAME}"
          else
            echo "::error title=Diff Error::Error occurred during diff, exit code $DIFF_EXIT_CODE"
            exit $DIFF_EXIT_CODE
          fi
      - name: Deploy
        env:
          CRONJOB_NAME: ${{ matrix.cronjob }}
          ENABLE_FORCE_UPGRADE: ${{ vars.HELM_FORCE_UPGRADE_CRONJOBS_CSV == '*' || contains(vars.HELM_FORCE_UPGRADE_CRONJOBS_CSV, matrix.cronjob) }}
          ENVIRONMENT: ${{ inputs.environment }}
          HELM_FORCE_UPGRADE_CRONJOBS_CSV: ${{ vars.HELM_FORCE_UPGRADE_CRONJOBS_CSV }}
          DEPLOY_MODE: ${{ needs.workflow_setup.outputs.cronjob_deploy_mode }}
        run: |
          set -euo pipefail

          echo "matrix.cronjob: $CRONJOB_NAME"
          echo "vars.HELM_FORCE_UPGRADE_CRONJOBS_CSV: $HELM_FORCE_UPGRADE_CRONJOBS_CSV"
          echo "ENABLE_FORCE_UPGRADE: $ENABLE_FORCE_UPGRADE"
          echo "INFO - Deploy mode: $DEPLOY_MODE"

          export PROJECT_DIR=$(pwd)

          $SCRIPTS_FOLDER/helmTemplate-cron-single.sh --debug -e "$ENVIRONMENT" --job $CRONJOB_NAME -i $PROJECT_DIR/commons/"$ENVIRONMENT"/images.yaml --output "$(pwd)/template.yaml"

          if [[ ! -s "$PROJECT_DIR/template.yaml" ]]; then
            echo "::error::Rendered manifest '$PROJECT_DIR/template.yaml' is missing or empty."
            exit 1
          fi

          K8S_NAMESPACE=$(cat "$PROJECT_DIR/template.yaml" | yq 'select(.kind == "CronJob") | .metadata.namespace')
          CRONJOB_FULLNAME=$(cat "$PROJECT_DIR/template.yaml" | yq 'select(.kind == "CronJob") | .metadata.name')
          
          if [[ -z "$K8S_NAMESPACE" || -z "$CRONJOB_FULLNAME" ]]; then
            echo "::error::Unable to resolve CronJob name or namespace from '$PROJECT_DIR/template.yaml'."
            exit 1
          fi
  
          echo "INFO - Apply changes for $CRONJOB_FULLNAME."

          case "$DEPLOY_MODE" in
            HELM_UPGRADE)
              HELM_UPGRADE_OPTIONS="--debug --skip-dep --output console"
              if [[ "$ENABLE_FORCE_UPGRADE" == "true" ]]; then
                echo "INFO - Force upgrade requested for $CRONJOB_FULLNAME"
                HELM_UPGRADE_OPTIONS=$HELM_UPGRADE_OPTIONS" --force"
              fi

              echo "INFO - Deploying $CRONJOB_FULLNAME with Helm upgrade."
              "$SCRIPTS_FOLDER/helmUpgrade-cron-single-standalone.sh" $HELM_UPGRADE_OPTIONS --environment "$K8S_NAMESPACE" -j "$CRONJOB_NAME" -i "$PROJECT_DIR/commons/$K8S_NAMESPACE/images.yaml"
              ;;
            KUBECTL_APPLY)
              if [[ "$ENABLE_FORCE_UPGRADE" == "true" ]]; then
                echo "::notice::HELM_FORCE_UPGRADE_CRONJOBS_CSV is ignored in KUBECTL_APPLY mode for $CRONJOB_FULLNAME."
              fi

              echo "INFO - Deploying $CRONJOB_FULLNAME by applying the rendered Helm manifest."
              kubectl apply --namespace "$K8S_NAMESPACE" --filename "$PROJECT_DIR/template.yaml"
              ;;
            *)
              echo "::error::Unsupported deploy mode '$DEPLOY_MODE'."
              exit 1
              ;;
          esac
